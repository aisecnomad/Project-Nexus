# Disposable ShadowScan Job. Keep live tenant credentials off any Job that
# mounts an untrusted repository. Replace the image digest before rollout.
# The second document denies egress for this offline job when the cluster CNI
# enforces NetworkPolicy. Populate /input with a reviewed read-only volume.
apiVersion: batch/v1
kind: Job
metadata:
  name: shadowscan
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1200
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shadowscan
        shadowscan-mode: offline
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: shadowscan
          image: registry.example.com/shadowscan@sha256:REPLACE_WITH_APPROVED_64_HEX_DIGEST
          imagePullPolicy: IfNotPresent
          args: ["code", "/input", "--format", "sarif", "-o", "/output/shadowscan.sarif"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "250m"
              memory: 512Mi
              ephemeral-storage: 1Gi
            limits:
              cpu: "1"
              memory: 1Gi
              ephemeral-storage: 4Gi
          volumeMounts:
            - name: input
              mountPath: /input
              readOnly: true
            - name: output
              mountPath: /output
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: input
          emptyDir:
            sizeLimit: 1Gi
        - name: output
          emptyDir:
            sizeLimit: 256Mi
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shadowscan-offline-deny-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: shadowscan
      shadowscan-mode: offline
  policyTypes: [Egress]
  egress: []
