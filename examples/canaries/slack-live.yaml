      resource: slack:app:ACANARYAI
      kind: bot-app
      present: true
    rationale: Known OpenAI integration is an AI application, not proof of autonomous execution.
  - id: attendance-app
    record:
      _kind: approved_app
      app.id: ACANARYBENIGN
    finding:
      resource: slack:app:ACANARYBENIGN
      present: false
    rationale: Independently inspected attendance helper has no model or agent integrations.
