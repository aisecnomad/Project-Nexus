# Drop into .github/workflows/ of any repository: scans the checkout for
# agent frameworks, MCP configs, coding-agent configs, IaC and LLM credentials
# and uploads the results to GitHub code scanning as SARIF.
#
# Pin ShadowScan itself to a tag or full commit. Floating `main` runs
# unreviewed scanner code in every consumer workflow.
name: ShadowScan
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
permissions:
  contents: read
  security-events: write
jobs:
  shadowscan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install "git+https://github.com/aisecnomad/Project-Nexus.git@v0.1.0"
      - run: shadowscan code . --inventory inventory/ --format sarif -o shadowscan.sarif --fail-on critical
        continue-on-error: true
      - uses: github/codeql-action/upload-sarif@e429ea58a9912cadc53f8132ad35562b54de1b30 # v3.38.1
        with:
          sarif_file: shadowscan.sarif
