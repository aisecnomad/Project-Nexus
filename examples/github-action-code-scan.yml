# Drop into .github/workflows/ of any repository: scans the checkout for
# agent frameworks, MCP configs, coding-agent configs, IaC and LLM credentials
# and uploads the results to GitHub code scanning as SARIF.
#
# Pin ShadowScan itself to a reviewed tag or full commit SHA. Floating `main`
# runs unreviewed scanner code in every consumer workflow.
# This immutable release-candidate revision exists; v0.1.1 is not published yet.
# Update the SHA only after reviewing the replacement and its passing checks.
name: ShadowScan
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
permissions:
  contents: read
  security-events: write
jobs:
  shadowscan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install "git+https://github.com/aisecnomad/Project-Nexus.git@48354ae1365474c9fe4f1610b68d7ba293a3269a"
      - run: shadowscan code . --inventory inventory/ --format sarif -o shadowscan.sarif --fail-on critical
      - uses: github/codeql-action/upload-sarif@e429ea58a9912cadc53f8132ad35562b54de1b30 # v3.38.1
        if: always() && hashFiles('shadowscan.sarif') != ''
        with:
          sarif_file: shadowscan.sarif
