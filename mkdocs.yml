site_name: ShadowScan
site_description: Discover shadow AI agents across your enterprise.
site_url: https://aisecnomad.github.io/Project-Nexus/
repo_url: https://github.com/aisecnomad/Project-Nexus
repo_name: aisecnomad/Project-Nexus
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - search.highlight
    - search.suggest
  icon:
    repo: fontawesome/brands/github

# Repository documents link to source files and tools outside docs/; those
# links are valid on GitHub but not on the rendered site. Report them without
# failing the strict build.
validation:
  links:
    not_found: info
    unrecognized_links: info
    absolute_links: info
  nav:
    omitted_files: info

plugins:
  - search
  - minify:
      minify_html: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      check_paths: true
      base_path: ["."]
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/install.md
      - Quick start: getting-started/quickstart.md
      - Configuration: getting-started/configuration.md
  - Connectors:
      - Overview: connectors.md
      - Code: connectors/code.md
      - Identity: connectors/identity.md
      - Gateway: connectors/gateway.md
      - Low-code: connectors/lowcode.md
      - SaaS: connectors/saas.md
      - Cloud: connectors/cloud.md
  - Concepts:
      - Architecture: architecture.md
      - Signatures: signatures.md
      - Inventory: inventory.md
      - Scanning: scanning.md
      - Risk scoring: concepts/risk.md
  - Operations:
      - Production deployment: production.md
      - Evaluation: evaluation.md
      - CI integration: operations/ci.md
  - Development:
      - Contributing: contributing.md
      - Governance: governance.md
      - ADRs: adrs/index.md
  - Security: security.md
  - Changelog: changelog.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/aisecnomad/Project-Nexus
