name: Documentation
description: Report missing, unclear, or incorrect documentation, or propose a docs improvement.
labels: [documentation]
body:
  - type: markdown
    attributes:
      value: |
        Documentation fixes are the fastest first contribution. If you already know
        the fix, a small pull request is welcome instead of an issue.

        **Do not include credentials, JWTs, private exports, or unsanitized scan output.**

  - type: dropdown
    id: location
    attributes:
      label: Where is the problem?
      options:
        - README
        - Documentation site (aisecnomad.github.io/Project-Nexus)
        - docs/connectors.md or a connector page
        - docs/production.md (deployment, migration, review status)
        - docs/signatures.md or docs/inventory.md
        - CLI help text (`shadowscan --help`, `shadowscan connectors`)
        - CONTRIBUTING, SECURITY, SUPPORT, or another community file
        - Somewhere else
    validations:
      required: true

  - type: input
    id: page
    attributes:
      label: Page or file
      description: Link to the page, or the repository path and heading.
      placeholder: "docs/connectors.md#identity, or https://aisecnomad.github.io/Project-Nexus/production/"
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: What kind of problem is it?
      options:
        - Incorrect (the docs do not match the tool's behavior)
        - Missing (a feature, option, or limit is undocumented)
        - Unclear (correct but hard to follow)
        - Broken link, formatting, or rendering
        - Typo or wording
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing?
      description: Quote the current text where possible and say what you expected to find.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Suggested change
      description: Proposed wording, or the information the page should carry. Optional.

  - type: input
    id: version
    attributes:
      label: ShadowScan version or commit
      description: Output of `shadowscan --version` or the commit SHA, if the problem is about behavior.
      placeholder: "0.1.1 or commit abc1234"

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a pull request for this change.
