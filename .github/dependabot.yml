version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - python
    reviewers:
      - aisecnomad
    groups:
      cloud-sdks:
        patterns:
          - "boto3"
          - "google-auth"
          - "azure-identity"
          - "oci"
      dev-tools:
        patterns:
          - "ruff"
          - "mypy"
          - "pytest*"
          - "pip-audit"
          - "pre-commit"
      core:
        patterns:
          - "click"
          - "rich"
          - "PyYAML"
          - "requests"
          - "urllib3"
          - "PyJWT"
          - "regex"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    reviewers:
      - aisecnomad

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - docker
    reviewers:
      - aisecnomad
