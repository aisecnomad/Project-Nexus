# Review routing comes from CODEOWNERS; the deprecated `reviewers` key is not
# used. The hash locks are refreshed by hand (see docs/production.md and their
# headers); Dependabot tracks the version ranges in pyproject.toml and the exact
# reviewed inputs in requirements-ci-constraints.txt. A ruff or mypy bump there
# must carry the matching immutable .pre-commit-config.yaml rev and version
# comment, which tests/test_repository_consistency.py checks.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - python
    groups:
      cloud-sdks:
        patterns:
          - "boto3"
          - "google-auth"
          - "azure-identity"
          - "oci"
      dev-tools:
        patterns:
          - "ruff"
          - "mypy"
          - "pytest*"
          - "pip-audit"
          - "pre-commit"
      core:
        patterns:
          - "click"
          - "rich"
          - "PyYAML"
          - "requests"
          - "urllib3"
          - "PyJWT"
          - "regex"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    groups:
      # One pull request per weekly run. Sub-actions of one repository (for
      # example codeql-action init, analyze and upload-sarif) must move
      # together: a workflow that mixes their versions fails at analysis time.
      actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - docker
    ignore:
      # Refresh the Dockerfile base image digest only. The interpreter line
      # follows the supported matrix in pyproject.toml and CI, not Docker Hub.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
