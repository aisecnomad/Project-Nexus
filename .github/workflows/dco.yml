name: DCO

# Checks that every non-merge commit in a pull request carries a
# Signed-off-by trailer matching that commit's author or committer email, per
# CONTRIBUTING.md's Developer Certificate of Origin section. Commits authored
# by GitHub's Dependabot app carry GitHub's fixed sign-off instead, and only
# that exact pairing is accepted for them. Read-only: it
# only inspects commit metadata already present in the fetched history and
# never checks out or executes the pull request's changed files.
#
# A commit message is not a patch: trailers are parsed with --no-divider, so a
# '---' line in the message (Dependabot opens its YAML metadata with one before
# its sign-off) does not hide the trailers after it.
#
# Trailer values are compared as literal strings (via `git interpret-trailers`
# and shell string equality), never interpolated into a regular expression: an
# attacker-controlled author/committer email containing regex metacharacters
# (for example `.*`) must not make an unrelated, forged Signed-off-by line
# match.
# Called from CI on pull requests so the required CI gate includes this result.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify every commit is signed off
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME:-}" != "pull_request" ]; then
            echo "DCO requires pull-request event context" >&2
            exit 1
          fi
          if ! [[ "${BASE_SHA:-}" =~ ^[0-9a-f]{40}$ ]] || ! [[ "${HEAD_SHA:-}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "DCO requires full lowercase base and head commit SHAs" >&2
            exit 1
          fi
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          git merge-base "$BASE_SHA" "$HEAD_SHA" >/dev/null
          # Capture first: failures inside process substitution do not propagate
          # through the loop, even under set -e, and must never yield success.
          commits="$(git rev-list "${BASE_SHA}..${HEAD_SHA}")"
          if [ -z "$commits" ]; then
            echo "DCO requires a nonempty pull-request commit range" >&2
            exit 1
          fi
          # Dependabot commits are authored by GitHub's Dependabot app (user id
          # 49699333) and signed off by GitHub as support@github.com. Accept
          # exactly that pairing, compared as literal strings like every other
          # sign-off; any other author must sign off as itself.
          dependabot_author='49699333+dependabot[bot]@users.noreply.github.com'
          dependabot_signoff='support@github.com'
          missing=0
          while IFS= read -r sha; do
            [ -z "$sha" ] && continue
            # Merge commits carry no new authorship of their own; skip them.
            if [ "$(git rev-list --min-parents=2 --max-parents=2 -1 "$sha" 2>/dev/null || true)" = "$sha" ]; then
              continue
            fi
            author_email="$(git show -s --format='%ae' "$sha" | tr '[:upper:]' '[:lower:]')"
            committer_email="$(git show -s --format='%ce' "$sha" | tr '[:upper:]' '[:lower:]')"
            ok=0
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              email="${line##*<}"
              email="${email%%>*}"
              email="$(printf '%s' "$email" | tr '[:upper:]' '[:lower:]')"
              if [ "$email" = "$author_email" ] || [ "$email" = "$committer_email" ]; then
                ok=1
                break
              fi
              if [ "$author_email" = "$dependabot_author" ] && [ "$email" = "$dependabot_signoff" ]; then
                ok=1
                break
              fi
            done <<TRAILERS
          $(git show -s --format='%B' "$sha" | git interpret-trailers --parse --no-divider | awk -F': ' 'tolower($1) == "signed-off-by" { $1=""; sub(/^: /,""); print }')
          TRAILERS
            if [ "$ok" -ne 1 ]; then
              echo "::error::Commit $sha is missing a Signed-off-by trailer matching $author_email"
              missing=1
            fi
          done <<< "$commits"
          if [ "$missing" -ne 0 ]; then
            echo "One or more commits are not signed off. Rebase with sign-off:" >&2
            echo "  git rebase --signoff ${BASE_SHA}" >&2
            echo "See CONTRIBUTING.md, 'Developer Certificate of Origin'." >&2
            exit 1
          fi
          echo "All commits signed off."
