name: Dependency and governance audit

# Dependabot does not refresh the hand-maintained hash locks, and the CI audit
# runs only on push and pull request. This weekly run re-checks every locked
# dependency set against current advisories, so a vulnerability published after
# the last commit still surfaces as a failed run.
# The independent read-only governance job also detects disabled or weakened
# visible main protections between commits. A withheld bypass list remains
# explicitly unknown and needs a separate administrator readback.
on:
  schedule:
    - cron: "41 4 * * 2"  # Tuesday 04:41 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  merge-policy:
    name: Verify visible main controls (bypass assurance separate)
    if: github.repository == 'aisecnomad/Project-Nexus' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the hash-locked verification toolchain
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-ci.lock
      - name: Observe current rulesets without changing settings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/governance-observations"
          mkdir "$evidence_dir"
          failed=0
          # Only a withheld bypass list permits partial assurance. Visible drift,
          # other missing fields and failed API reads still fail the job. Never
          # supply an administrator credential or treat partial as release proof.
          for ruleset_id in 23892853 23913372; do
            snapshot="$evidence_dir/ruleset-$ruleset_id.json"
            if gh api "repos/$GITHUB_REPOSITORY/rulesets/$ruleset_id" > "$snapshot"; then
              if ! python -m tools.governance.rulesets observe \
                --input "$snapshot" --ruleset-id "$ruleset_id" \
                --expected ".github/rulesets/$ruleset_id.update.json" \
                --output "$evidence_dir/observation-$ruleset_id.json" \
                --summary "$GITHUB_STEP_SUMMARY"; then
                failed=1
              fi
            else
              if ! python -m tools.governance.rulesets observe \
                --input "$snapshot" --ruleset-id "$ruleset_id" \
                --expected ".github/rulesets/$ruleset_id.update.json" \
                --output "$evidence_dir/observation-$ruleset_id.json" \
                --summary "$GITHUB_STEP_SUMMARY" --read-failed; then
                failed=1
              fi
            fi
          done
          exit "$failed"
      - name: Retain scoped governance observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: governance-observations-${{ github.run_id }}
          path: ${{ runner.temp }}/governance-observations/observation-*.json
          if-no-files-found: error
          retention-days: 90
  lock-audit:
    name: Audit hash-locked dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the hash-locked audit tool
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-ci.lock
      - name: Audit every hash-locked dependency set
        run: |
          # Same commands as the CI lock audit: fail if a locked package cannot be checked.
          for lock in requirements.lock requirements-build.lock requirements-ci.lock requirements-docs.lock; do
            pip-audit --require-hashes --strict --progress-spinner off \
              --disable-pip -r "$lock"
          done
