name: Dependency audit

# Dependabot does not refresh the hand-maintained hash locks, and the CI audit
# runs only on push and pull request. This weekly run re-checks every locked
# dependency set against current advisories, so a vulnerability published after
# the last commit still surfaces as a failed run.
on:
  schedule:
    - cron: "41 4 * * 2"  # Tuesday 04:41 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock-audit:
    name: Audit hash-locked dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the hash-locked audit tool
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-ci.lock
      - name: Audit every hash-locked dependency set
        run: |
          # Same commands as the CI lock audit: fail if a locked package cannot be checked.
          for lock in requirements.lock requirements-build.lock requirements-ci.lock requirements-docs.lock; do
            pip-audit --require-hashes --strict --progress-spinner off \
              --disable-pip -r "$lock"
          done
