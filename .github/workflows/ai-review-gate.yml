name: AI review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # Only a pull request that carries evidence has anything to review. Without
    # this filter every other pull request failed closed on absent evidence, and
    # the first pull request to add the gate failed because its base ref had no
    # gate modules yet.
    paths:
      - ".github/ai-review/**"
permissions:
  contents: read
concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: evidence
          sparse-checkout: .github/ai-review
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate untrusted evidence using base code
        working-directory: trusted
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          AI_REVIEW_INPUT: ${{ github.workspace }}/evidence/.github/ai-review
          AI_REVIEW_OUT_DIR: ${{ runner.temp }}/ai-review-preflight
        run: python -m tools.ai_review.github_gate preflight
  orchestrator:
    name: AI review publication
    needs: preflight
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: evidence
          sparse-checkout: .github/ai-review
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Revalidate, synthesize and publish one review and check
        working-directory: trusted
        env:
          AI_REVIEW_PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          AI_REVIEW_INPUT: ${{ github.workspace }}/evidence/.github/ai-review
          AI_REVIEW_OUT_DIR: ${{ runner.temp }}/ai-review-synthesis
        run: python -m tools.ai_review.github_gate publish
