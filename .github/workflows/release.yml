name: Release candidate evidence

# Deliberately produces a review bundle only. Publishing a package or GitHub
# release is a separate maintainer action after review and tenant acceptance.
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Full main commit SHA reviewed for this candidate
        required: true
        type: string
      ci_run_id:
        description: Successful push CI run ID for that exact main commit
        required: true
        type: string
      codeql_run_id:
        description: Successful push CodeQL run ID for that exact main commit
        required: true
        type: string

permissions: {}
concurrency:
  group: release-candidate-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify exact commit and successful main CI and CodeQL
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          CODEQL_RUN_ID: ${{ inputs.codeql_run_id }}
        run: |
          python - <<'PY'
          import os
          import re
          if not re.fullmatch(r'[0-9a-f]{40}', os.environ['EXPECTED_COMMIT']):
              raise SystemExit('expected_commit must be a full lowercase SHA')
          if os.environ['EXPECTED_COMMIT'] != os.environ['GITHUB_SHA']:
              raise SystemExit('main moved; select and review the current main commit')
          for name in ('CI_RUN_ID', 'CODEQL_RUN_ID'):
              if not re.fullmatch(r'[1-9][0-9]*', os.environ[name]):
                  raise SystemExit(f'{name.lower()} must be a positive integer')
          PY
          mkdir candidate
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" > "$RUNNER_TEMP/ci-run.json"
          python -m tools.release.evidence verify-ci \
            --input "$RUNNER_TEMP/ci-run.json" --output candidate/ci-verification.json \
            --repository "$GITHUB_REPOSITORY" --expected-sha "$EXPECTED_COMMIT" \
            --current-sha "$GITHUB_SHA" --run-id "$CI_RUN_ID"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CODEQL_RUN_ID" > "$RUNNER_TEMP/codeql-run.json"
          python -m tools.release.evidence verify-codeql \
            --input "$RUNNER_TEMP/codeql-run.json" --output candidate/codeql-verification.json \
            --repository "$GITHUB_REPOSITORY" --expected-sha "$EXPECTED_COMMIT" \
            --current-sha "$GITHUB_SHA" --run-id "$CODEQL_RUN_ID"
      - name: Install pinned build tools and locked runtime
        run: |
          python -m pip install --upgrade --only-binary=:all: pip==26.2.1
          python -m pip install --require-hashes --only-binary=:all: -r requirements-build.lock
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock
          python - <<'PY'
          import os
          import re
          from pathlib import Path
          pins = [line.split()[0]
                  for lock in ('requirements.lock', 'requirements-build.lock')
                  for line in Path(lock).read_text().splitlines()
                  if re.match(r'^[A-Za-z0-9_.-]+==[^\s]+', line)]
          if not pins:
              raise SystemExit('runtime lock has no version pins')
          (Path(os.environ['RUNNER_TEMP']) / 'runtime-constraints.txt').write_text('\n'.join(pins) + '\n')
          PY
          python -m pip install --only-binary=:all: \
            -c "$RUNNER_TEMP/runtime-constraints.txt" -c requirements-ci-constraints.txt pip-audit
          python -m pip check
      - name: Build wheel from the verified source
        run: |
          git diff --exit-code
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH
          python -m pip install --require-hashes --only-binary=:all: -r requirements-build.lock
          python -m pip wheel . --no-deps --no-build-isolation --wheel-dir candidate
      - name: Validate the installed wheel outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/release-wheel"
          "$RUNNER_TEMP/release-wheel/bin/python" -m pip install \
            --require-hashes --only-binary=:all: -r requirements.lock
          "$RUNNER_TEMP/release-wheel/bin/python" -m pip install --no-deps candidate/*.whl
          "$RUNNER_TEMP/release-wheel/bin/python" -m pip check
          cp tests/fixtures/sample_repo/services/research-agent/app/agent.py "$RUNNER_TEMP/release-smoke.py"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/release-wheel/bin/python" -m shadowscan.signatures.validate
          "$RUNNER_TEMP/release-wheel/bin/shadowscan" --help
          mkdir release-input
          cp release-smoke.py release-input/agent.py
          "$RUNNER_TEMP/release-wheel/bin/shadowscan" code release-input --format json > release-smoke.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('release-smoke.json').read_text())
          if report['summary']['complete'] is not True or not report['findings']:
              raise SystemExit('installed wheel smoke scan failed')
          PY
      - name: Audit locked runtime and create its SBOM
        run: |
          pip-audit --require-hashes --strict --progress-spinner off \
            -r requirements.lock -f cyclonedx-json -o candidate/runtime-sbom.cdx.json
      - name: Record source identity, dependency pins and file digests
        run: |
          cp requirements.lock requirements-build.lock requirements-ci-constraints.txt candidate/
          python -m tools.release.evidence manifest --directory candidate \
            --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --workflow-run "$GITHUB_RUN_ID"
          cd candidate
          sha256sum --check SHA256SUMS
      - name: Retain candidate for review
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ github.sha }}
          path: candidate/*
          if-no-files-found: error
          retention-days: 90

  attest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No source checkout or package execution in this job with signing rights.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: candidate
          digest-mismatch: error
      - name: Verify transferred candidate bytes
        working-directory: candidate
        run: sha256sum --check SHA256SUMS
      - name: Attest candidate provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: candidate/*
          create-storage-record: false
      - name: Attest locked runtime SBOM for the wheel
        id: sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: candidate/*.whl
          sbom-path: candidate/runtime-sbom.cdx.json
          create-storage-record: false
      - name: Retain verification bundles
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom.outputs.bundle-path }}
        run: |
          mkdir attestations
          cp "$PROVENANCE_BUNDLE" attestations/provenance.json
          cp "$SBOM_BUNDLE" attestations/sbom.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-attestations-${{ github.sha }}
          path: attestations/*
          if-no-files-found: error
          retention-days: 90
