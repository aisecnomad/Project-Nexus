# Black Duck Security Action: SAST and SCA through Black Duck SCA, Coverity,
# Polaris or Software Risk Manager (https://github.com/blackduck-inc/black-duck-security-scan).
# The action is third-party code, pinned by full commit SHA.
#
# The job runs only when at least one of those services is configured as a
# repository variable (BLACKDUCKSCA_URL, COVERITY_URL, POLARIS_SERVER_URL or
# SRM_URL) with its secret; until then it is skipped rather than failing every
# run. Pull requests from forks receive no secrets, so a configured scan of a
# fork pull request fails closed. The action gets no GitHub token: it uploads
# results through security-events and does not comment on pull requests.

name: CI Black Duck security scan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "25 6 * * 3"

permissions:
  contents: read

jobs:
  build:
    if: >-
      vars.BLACKDUCKSCA_URL != '' || vars.COVERITY_URL != '' ||
      vars.POLARIS_SERVER_URL != '' || vars.SRM_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Black Duck SCA scan
        uses: blackduck-inc/black-duck-security-scan@805cbd09e806b01907bbea0f990723c2bb85abe9
        with:
          # Black Duck SCA
          blackducksca_url: ${{ vars.BLACKDUCKSCA_URL }}
          blackducksca_token: ${{ secrets.BLACKDUCKSCA_TOKEN }}
          # Coverity
          coverity_url: ${{ vars.COVERITY_URL }}
          coverity_user: ${{ secrets.COVERITY_USER }}
          coverity_passphrase: ${{ secrets.COVERITY_PASSPHRASE }}
          # Polaris
          polaris_server_url: ${{ vars.POLARIS_SERVER_URL }}
          polaris_access_token: ${{ secrets.POLARIS_ACCESS_TOKEN }}
          polaris_assessment_types: "SCA,SAST"
          # Software Risk Manager
          srm_url: ${{ vars.SRM_URL }}
          srm_apikey: ${{ secrets.SRM_API_KEY }}
          srm_assessment_types: "SCA,SAST"
