name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Update installer and install development checks
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock
          python -m pip check
      - name: Validate signature schemas and regular expressions
        run: python -m shadowscan.signatures.validate
      - run: ruff check shadowscan tests
      - run: mypy shadowscan
      - run: pip-audit --progress-spinner off
      - run: python -m pytest -q --cov=shadowscan --cov-report=term-missing --cov-fail-under=80
      - name: Build distributable wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Validate installed wheel outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/shadowscan-wheel"
          "$RUNNER_TEMP/shadowscan-wheel/bin/python" -m pip install --require-hashes --only-binary=:all: -r requirements.lock
          "$RUNNER_TEMP/shadowscan-wheel/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/shadowscan-wheel/bin/python" -m pip check
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/shadowscan-wheel/bin/python" -m shadowscan.signatures.validate
          "$RUNNER_TEMP/shadowscan-wheel/bin/shadowscan" --help
      - name: Build and validate disposable worker
        if: matrix.python == '3.12'
        run: |
          docker build --tag shadowscan:ci .
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --entrypoint python shadowscan:ci \
            -c 'import os, subprocess; assert os.geteuid() == 65532; subprocess.run(["python", "-m", "shadowscan.signatures.validate"], check=True)'
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --memory 1g --pids-limit 128 \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --mount "type=bind,source=$PWD/tests/fixtures/sample_repo,target=/input,readonly" \
            shadowscan:ci code /input --format json > "$RUNNER_TEMP/container-report.json"
          python -c 'import json, os, pathlib; report = json.loads((pathlib.Path(os.environ["RUNNER_TEMP"]) / "container-report.json").read_text()); assert report["summary"]["complete"] is True; assert report["findings"]'
      - name: Self-scan (demo, offline)
        run: shadowscan scan -c examples/shadowscan.offline.yaml --format sarif -o shadowscan.sarif
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && hashFiles('shadowscan.sarif') != ''
        with:
          name: shadowscan-sarif-${{ matrix.python }}
          path: shadowscan.sarif
