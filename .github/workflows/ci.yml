name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Update installer and install development checks
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[all]"
      - name: Validate signature schemas and regular expressions
        run: python -m shadowscan.signatures.validate
      - run: ruff check shadowscan tests
      - run: mypy shadowscan
      - run: pip-audit --progress-spinner off
      - run: python -m pytest -q --cov=shadowscan --cov-report=term-missing --cov-fail-under=80
      - name: Build distributable wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Self-scan (demo, offline)
        run: shadowscan scan -c examples/shadowscan.offline.yaml --format sarif -o shadowscan.sarif
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && hashFiles('shadowscan.sarif') != ''
        with:
          name: shadowscan-sarif-${{ matrix.python }}
          path: shadowscan.sarif
