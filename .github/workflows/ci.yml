name: CI
on:
  push:
    branches: [main]
  pull_request:
  # Weekly on main: the worker image is rebuilt from the current Wolfi packages
  # and rescanned with a fresh vulnerability database even when nothing merges.
  schedule:
    - cron: "17 5 * * 1"  # Monday 05:17 UTC
permissions:
  contents: read
concurrency:
  # A newer pull-request push supersedes the older run. Every main push run must
  # finish: release evidence cites the CI run of one exact main commit. A shared
  # group would still replace a pending main run with a newer one, so each push
  # run gets its own group.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  dco:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/dco.yml
    permissions:
      contents: read
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the hash-locked documentation toolchain
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-docs.lock
      - name: Validate docs without deployment
        run: mkdocs build --strict
  test-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install the hash-locked runtime, cloud and development toolchain
        run: |
          # The runtime lock lists every published wheel hash, so the cloud SDKs
          # install from it here too and the suite exercises their code paths on
          # this platform as well.
          python -m pip install --require-hashes --only-binary=:all: -r requirements-ci.lock -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Check native file confinement and plugin worker lifecycle
        run: pytest -q tests/unit/test_confined_file_portability.py tests/unit/test_plugin_process.py
      - name: Validate signature schemas and regular expressions
        run: python -m shadowscan.signatures.validate
      - run: ruff check shadowscan tests tools
      - run: ruff format --check shadowscan tests tools
      - run: mypy shadowscan tools
      # The full suite without coverage tracing; the Linux coverage leg of the
      # test job enforces both coverage floors. The console entry point is used
      # on purpose: it must import the checkout-only tools packages.
      - run: pytest -q
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
        # One leg traces line and branch coverage and enforces the aggregate
        # and per-connector floors. Tracing slows the suite several-fold and
        # the floors measure the tests, not the interpreter, so the other legs
        # (and macOS) run the same full suite untraced.
        include:
          - python: "3.11"
            coverage: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          # Hash-locked installs are safe to cache; the key follows every pin file.
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-build.lock
            requirements-ci.lock
      - name: Check requirements-build.lock matches the pyproject build-system pins
        run: |
          python - <<'PY'
          import re
          import tomllib
          from pathlib import Path
          declared = sorted(tomllib.loads(Path('pyproject.toml').read_text())['build-system']['requires'])
          locked = sorted(line.split()[0] for line in Path('requirements-build.lock').read_text().splitlines()
                          if re.match(r'^[A-Za-z0-9_.-]+==[^\s]+', line))
          # The lock may also pin the backends' own dependencies (wheel needs
          # packaging); every declared backend must appear at exactly its pin.
          missing = sorted(set(declared) - set(locked))
          assert not missing, f'requirements-build.lock is missing pyproject.toml build-system pins {missing} (locked: {locked})'
          PY
      - name: Install hash-locked build, runtime and development tools
        run: |
          # The runner's bootstrap pip verifies the pinned pip wheel before it
          # replaces itself. Every subsequently executed Python tool comes from
          # one of these reviewed SHA-256 locks.
          python -m pip install --require-hashes --only-binary=:all: \
            -r requirements-ci.lock -r requirements-build.lock -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Check tracked files for hardcoded credentials
        run: |
          set -euo pipefail
          # The same standard-library script as the pre-commit hook: every
          # tracked file, with exact reviewed synthetic-value approvals only.
          git ls-files -z | xargs -0 python tools/check_secrets.py
      - name: Validate signature schemas and regular expressions
        run: python -m shadowscan.signatures.validate
      - run: ruff check shadowscan tests tools
      - run: ruff format --check shadowscan tests tools
      - run: mypy shadowscan tools
      # Audit installed dependencies; the editable scanner is unpublished source,
      # so querying its version on PyPI is not a dependency vulnerability check.
      - run: pip-audit --skip-editable --progress-spinner off
      - name: Audit every hash-locked dependency set
        run: |
          # Fail if a locked package cannot be checked, even when an installed
          # environment audit permits an intentionally skipped editable package.
          for lock in requirements.lock requirements-build.lock requirements-ci.lock requirements-docs.lock; do
            pip-audit --require-hashes --strict --progress-spinner off \
              --disable-pip -r "$lock"
          done
      - name: Run the test suite
        if: ${{ !matrix.coverage }}
        run: python -m pytest -q
      - name: Run the test suite with line and branch coverage
        if: ${{ matrix.coverage }}
        run: python -m pytest -q --cov=shadowscan --cov-report=term-missing --cov-fail-under=80
      - name: Enforce per-connector coverage floor
        if: ${{ matrix.coverage }}
        run: |
          python -m coverage json -o "$RUNNER_TEMP/shadowscan-coverage.json"
          python -m tools.coverage_gate "$RUNNER_TEMP/shadowscan-coverage.json"
      - name: Evaluate labeled detection cases
        run: |
          python -m tools.evaluation.evaluate --output "$RUNNER_TEMP/shadowscan-synthetic-evaluation.json"
          python -m tools.evaluation.evaluate --corpus tools/evaluation/public_corpus.json \
            --output "$RUNNER_TEMP/shadowscan-public-evaluation.json"
          # Multi-file cases; documented misses carry known_gap and do not fail the run.
          python -m tools.evaluation.evaluate --corpus tools/evaluation/realistic_corpus.json \
            --output "$RUNNER_TEMP/shadowscan-realistic-evaluation.json"
          python -m tools.evaluation.evaluate --corpus tools/evaluation/review_corpus.json \
            --output "$RUNNER_TEMP/shadowscan-review-evaluation.json"
          python -m tools.evaluation.evaluate --corpus tools/evaluation/field_review_corpus.json \
            --output "$RUNNER_TEMP/shadowscan-field-review-evaluation.json"
          python -m tools.evaluation.evaluate --corpus tools/evaluation/attribution_corpus.json \
            --output "$RUNNER_TEMP/shadowscan-attribution-evaluation.json"
          python -m tools.evaluation.evaluate --corpus tools/evaluation/current_idioms_corpus.json \
            --output "$RUNNER_TEMP/shadowscan-current-idioms-evaluation.json"
          python -m tools.evaluation.evaluate --corpus tools/evaluation/independent_corpus.json \
            --annotations tools/evaluation/independent_annotations.json \
            --output "$RUNNER_TEMP/shadowscan-independent-evaluation.json"
      - name: Build distributable wheel
        run: |
          # Re-assert the hash-locked backend so the wheel generator matches
          # pyproject.toml [build-system] after the combined locked install.
          python -m pip install --require-hashes --only-binary=:all: -r requirements-build.lock
          python -m pip wheel . --no-deps --no-build-isolation --wheel-dir dist
      - name: Validate installed wheel outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/shadowscan-wheel"
          "$RUNNER_TEMP/shadowscan-wheel/bin/python" -m pip install --require-hashes --only-binary=:all: -r requirements.lock
          "$RUNNER_TEMP/shadowscan-wheel/bin/python" -m pip install --no-deps dist/nexusshadowscan-*.whl
          "$RUNNER_TEMP/shadowscan-wheel/bin/python" -m pip check
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/shadowscan-wheel/bin/python" -c 'from importlib.metadata import distribution; import shadowscan; package = distribution("NexusShadowScan"); assert package.version == shadowscan.__version__; assert any(ep.name == "shadowscan" and ep.value == "shadowscan.cli:main" for ep in package.entry_points)'
          "$RUNNER_TEMP/shadowscan-wheel/bin/python" -m shadowscan.signatures.validate
          "$RUNNER_TEMP/shadowscan-wheel/bin/shadowscan" --help
      - name: Self-scan (demo, offline)
        run: shadowscan scan -c examples/shadowscan.offline.yaml --format sarif -o shadowscan.sarif
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: shadowscan-evaluation-${{ matrix.python }}
          path: ${{ runner.temp }}/shadowscan-*-evaluation.json
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && hashFiles('shadowscan.sarif') != ''
        with:
          name: shadowscan-sarif-${{ matrix.python }}
          path: shadowscan.sarif
          retention-days: 1
  container-security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Official immutable v0.74.0 release; reviewed Linux x86_64 asset digest:
      # https://api.github.com/repos/aquasecurity/trivy/releases/tags/v0.74.0
      # Resolved 2026-10-02. Refresh version and digest together after review.
      TRIVY_VERSION: "0.74.0"
      TRIVY_SHA256: "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Route anonymous Docker Hub pulls through a pull-through mirror
        env:
          DOCKER_HUB_MIRROR: https://mirror.gcr.io
        run: |
          set -euo pipefail
          # Hosted runners share egress addresses, so anonymous Docker Hub pulls
          # routinely hit its rate limit (HTTP 429) and the build cannot resolve
          # the base image. mirror.gcr.io is Google's Docker Hub pull-through
          # cache. The daemon uses a registry mirror for Docker Hub images only
          # and falls back to Docker Hub when the mirror fails. Keep the runner's
          # other daemon settings; a missing file is an empty configuration.
          daemon_json=/etc/docker/daemon.json
          if sudo test -e "$daemon_json"; then
            sudo cat "$daemon_json" > "$RUNNER_TEMP/daemon.json"
          else
            printf '{}\n' > "$RUNNER_TEMP/daemon.json"
          fi
          python - "$RUNNER_TEMP/daemon.json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path
          path = Path(sys.argv[1])
          config = json.loads(path.read_text(encoding='utf-8'))
          if not isinstance(config, dict) or not isinstance(config.get('registry-mirrors', []), list):
              raise SystemExit('daemon.json must be an object whose registry-mirrors is a list')
          mirror = os.environ['DOCKER_HUB_MIRROR']
          mirrors = config.setdefault('registry-mirrors', [])
          # dockerd accepts a mirror with or without its trailing slash, so
          # compare without it and never list the same mirror twice.
          if not any(isinstance(entry, str) and entry.rstrip('/') == mirror.rstrip('/') for entry in mirrors):
              mirrors.append(mirror)
          path.write_text(json.dumps(config, indent=2) + '\n', encoding='utf-8')
          PY
          sudo install -m 0644 "$RUNNER_TEMP/daemon.json" "$daemon_json"
          sudo systemctl restart docker
          # Block unless the restarted daemon reports the mirror, which it lists
          # with a trailing slash.
          mirrors="$(docker info --format '{{range .RegistryConfig.Mirrors}}{{println .}}{{end}}')"
          if ! grep -Fqx -e "$DOCKER_HUB_MIRROR" -e "$DOCKER_HUB_MIRROR/" <<< "$mirrors"; then
            echo "the Docker daemon does not report the registry mirror $DOCKER_HUB_MIRROR" >&2
            exit 1
          fi
      - name: Pull the digest-pinned base image before the build
        run: |
          set -euo pipefail
          # Read the references from the Dockerfile's FROM lines, so a reviewed
          # Dependabot digest refresh cannot leave this step pulling another
          # image, and pull name@digest without the tag. A digest pull is
          # content-verified: the mirror cannot substitute other bytes. With the
          # default docker driver, BuildKit prefers a digest already in the local
          # image store and resolves anything else through the daemon's registry
          # configuration, so the mirror covers the build's own lookups as well.
          python - > "$RUNNER_TEMP/base-images.txt" <<'PY'
          import re
          from pathlib import Path
          # A heredoc opener as BuildKit reads one: <<WORD, <<-WORD, <<'WORD' or <<"WORD".
          heredoc = re.compile(r'''(?<!\S)\d*<<(-?)(["']?)([^\s"'<]+)\2(?!\S)''')
          lines = iter(Path('Dockerfile').read_text(encoding='utf-8').splitlines())
          references = []
          for line in lines:
              if not line.strip() or line.lstrip().startswith('#'):
                  continue
              # Only the first line of an instruction names it. Join backslash
              # continuations, dropping the comment and blank lines Docker drops
              # inside them, and skip each heredoc body through its terminator
              # line (leading tabs stripped for <<-), so a script line such as
              # `from pathlib import Path` is never read as a FROM.
              while line.rstrip().endswith('\\'):
                  following = next(lines, None)
                  if following is None:
                      break
                  if following.strip() and not following.lstrip().startswith('#'):
                      line = line.rstrip()[:-1] + ' ' + following
              keyword, *arguments = line.split()
              if keyword.upper() in ('RUN', 'COPY', 'ADD'):
                  for chomp, _, word in heredoc.findall(line):
                      if not any((body.lstrip('\t') if chomp else body) == word for body in lines):
                          raise SystemExit(f'the Dockerfile heredoc {word} is not terminated')
              if keyword.upper() != 'FROM':
                  continue
              image = next((argument for argument in arguments if not argument.startswith('--')), '')
              name, _, digest = image.partition('@')
              if not name or not re.fullmatch(r'sha256:[0-9a-f]{64}', digest):
                  raise SystemExit(f'FROM {image} is not a digest-pinned image reference')
              repository, slash, last = name.rpartition('/')
              reference = f"{repository}{slash}{last.partition(':')[0]}@{digest}"
              if reference not in references:
                  references.append(reference)
          if not references:
              raise SystemExit('the Dockerfile names no base image')
          print('\n'.join(references))
          PY
          while IFS= read -r image; do
            attempt=1
            until timeout 180s docker pull "$image"; do
              if (( attempt == 3 )); then
                echo "could not pull $image after $attempt attempts" >&2
                exit 1
              fi
              sleep $(( attempt * 10 ))
              attempt=$(( attempt + 1 ))
            done
          done < "$RUNNER_TEMP/base-images.txt"
      - name: Build and validate one immutable worker image
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/container-evidence"
          mkdir "$evidence_dir"
          printf 'CONTAINER_EVIDENCE=%s\n' "$evidence_dir" >> "$GITHUB_ENV"
          # A Docker image ID binds the local config and its layer hashes. It is
          # not a registry manifest digest and this workflow publishes no image.
          docker build --tag shadowscan:ci --label "org.opencontainers.image.revision=$GITHUB_SHA" .
          image_id="$(docker image inspect --format '{{.Id}}' shadowscan:ci)"
          [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'CONTAINER_IMAGE_ID=%s\n' "$image_id" >> "$GITHUB_ENV"
          docker image inspect "$image_id" > "$evidence_dir/image-inspect.json"
          # Repository XML is parsed by Python's bundled expat, which an image
          # scan does not inventory; 2.8.5 carries the October 2026 expat fixes.
          # The build backend and pip stay in the build stage.
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --entrypoint python "$image_id" \
            -c 'import importlib.util, os, pyexpat, subprocess; assert os.geteuid() == 65532; expat = tuple(int(part) for part in pyexpat.EXPAT_VERSION.removeprefix("expat_").split(".")); assert expat >= (2, 8, 5), pyexpat.EXPAT_VERSION; build_tools = [name for name in ("pip", "setuptools", "wheel") if importlib.util.find_spec(name)]; assert not build_tools, build_tools; subprocess.run(["python", "-m", "shadowscan.signatures.validate"], check=True)'
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --memory 1g --pids-limit 128 \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --mount "type=bind,source=$PWD/tests/fixtures/sample_repo,target=/input,readonly" \
            "$image_id" code /input --format json > "$evidence_dir/smoke-report.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads((Path(os.environ['RUNNER_TEMP']) / 'container-evidence/smoke-report.json').read_text())
          if report['summary']['complete'] is not True or not report['findings']:
              raise SystemExit('container smoke scan failed')
          PY
      - name: Install the digest-verified Trivy binary
        run: |
          set -euo pipefail
          tool_dir="$(mktemp -d "$RUNNER_TEMP/trivy-tool.XXXXXX")"
          archive="$tool_dir/trivy.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --connect-timeout 20 --max-time 180 --retry 2 --retry-max-time 240 \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$TRIVY_SHA256" "$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$tool_dir" trivy
          printf 'TRIVY_BIN=%s\n' "$tool_dir/trivy" >> "$GITHUB_ENV"
      - name: Acquire a fresh bounded vulnerability database
        run: |
          set -euo pipefail
          cache_dir="$(mktemp -d "$RUNNER_TEMP/trivy-db.XXXXXX")"
          printf 'TRIVY_CACHE_DIR=%s\n' "$cache_dir" >> "$GITHUB_ENV"
          # Never restore a PR-populated cache. A registry outage, timeout, or
          # database older than 48 hours blocks the job; no empty-scan fallback.
          printf '{}\n' > "$CONTAINER_EVIDENCE/trivy.yaml"
          : > "$CONTAINER_EVIDENCE/no-ignores"
          timeout 300s "$TRIVY_BIN" image --download-db-only --timeout 4m \
            --config "$CONTAINER_EVIDENCE/trivy.yaml" --cache-dir "$cache_dir" \
            --db-repository ghcr.io/aquasecurity/trivy-db:2 \
            --db-repository mirror.gcr.io/aquasec/trivy-db:2 \
            --disable-telemetry --skip-version-check
          cp "$cache_dir/db/metadata.json" "$CONTAINER_EVIDENCE/database-metadata.json"
          sha256sum "$cache_dir/db/trivy.db" | cut -d ' ' -f 1 > "$CONTAINER_EVIDENCE/database-sha256.txt"
          "$TRIVY_BIN" version --format json --cache-dir "$cache_dir" > "$CONTAINER_EVIDENCE/trivy-version.json"
          python -m tools.container.verify database "$CONTAINER_EVIDENCE"
      - name: Inventory and scan the exact image for OS and Python vulnerabilities
        run: |
          set -euo pipefail
          common=(--config "$CONTAINER_EVIDENCE/trivy.yaml" --cache-dir "$TRIVY_CACHE_DIR"
            --image-src docker --pkg-types os,library --offline-scan
            --skip-db-update --skip-java-db-update --skip-check-update --skip-version-check
            --disable-telemetry --timeout 4m --ignorefile "$CONTAINER_EVIDENCE/no-ignores"
            --ignore-unfixed=false --list-all-pkgs)
          timeout 300s "$TRIVY_BIN" image "${common[@]}" --format cyclonedx \
            --output "$CONTAINER_EVIDENCE/container-sbom.cdx.json" "$CONTAINER_IMAGE_ID"
          scan_exit=0
          timeout 300s "$TRIVY_BIN" image "${common[@]}" --scanners vuln \
            --severity HIGH,CRITICAL --exit-code 1 --format json \
            --output "$CONTAINER_EVIDENCE/container-vulnerabilities.json" "$CONTAINER_IMAGE_ID" || scan_exit=$?
          # Verify inventory, image/source identity, scanner/database identity and
          # exit/result consistency. Unfixed HIGH/CRITICAL findings also block.
          python -m tools.container.verify bundle "$CONTAINER_EVIDENCE" \
            --image-id "$CONTAINER_IMAGE_ID" --source-sha "$GITHUB_SHA" \
            --scanner-version "$TRIVY_VERSION" --scanner-sha256 "$TRIVY_SHA256" \
            --scan-exit "$scan_exit" --os-type wolfi
      - name: Retain container evidence including blocked scans
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shadowscan-container-${{ github.sha }}
          path: ${{ runner.temp }}/container-evidence/*
          if-no-files-found: error
          retention-days: 14
  gate:
    name: CI gate
    if: always()
    needs: [dco, docs, test-macos, test, container-security]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every applicable CI job
        env:
          EVENT_NAME: ${{ github.event_name }}
          DOCS_RESULT: ${{ needs.docs.result }}
          MACOS_RESULT: ${{ needs.test-macos.result }}
          TEST_RESULT: ${{ needs.test.result }}
          DCO_RESULT: ${{ needs.dco.result }}
          CONTAINER_RESULT: ${{ needs.container-security.result }}
        run: |
          python - <<'PY'
          import os
          import sys
          event = os.environ['EVENT_NAME']
          expected = {
              'DOCS_RESULT': 'success',
              'MACOS_RESULT': 'success',
              'TEST_RESULT': 'success',
              'CONTAINER_RESULT': 'success',
          }
          if event == 'pull_request':
              expected['DCO_RESULT'] = 'success'
          elif event in ('push', 'schedule'):
              expected['DCO_RESULT'] = 'skipped'
          else:
              sys.exit(f'unsupported CI event: {event}')
          failed = [f'{name}={os.environ.get(name)!r} (expected {value})'
                    for name, value in expected.items() if os.environ.get(name) != value]
          if failed:
              sys.exit('CI gate failed: ' + ', '.join(failed))
          print('All applicable CI jobs passed, including the complete Python matrix.')
          PY
