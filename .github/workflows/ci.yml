name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A new push to a pull request supersedes its running checks. A main run is
  # never cancelled: release evidence needs a successful push run for the exact
  # main commit, so a newer main push waits for the running one to finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  dco:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/dco.yml
    permissions:
      contents: read
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the hash-locked documentation toolchain
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-docs.lock
      - name: Validate docs without deployment
        run: mkdocs build --strict
  test-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install the hash-locked runtime, cloud and development toolchain
        run: |
          # The runtime lock lists every published wheel hash, so the cloud SDKs
          # install from it here too and the suite exercises their code paths on
          # this platform as well.
          python -m pip install --require-hashes --only-binary=:all: -r requirements-ci.lock -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Validate signature schemas and regular expressions
        run: python -m shadowscan.signatures.validate
      - run: ruff check shadowscan tests tools
      - run: ruff format --check shadowscan tests tools
      - run: mypy shadowscan tools/evaluation tools/canaries tools/acceptance tools/release
      # The full suite without coverage tracing; the Linux coverage leg of the
      # test job enforces both coverage floors.
      - run: python -m pytest -q
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
        # One leg traces line and branch coverage and enforces the aggregate
        # and per-connector floors. Tracing slows the suite several-fold and
        # the floors measure the tests, not the interpreter, so the other legs
        # (and macOS) run the same full suite untraced.
        include:
          - python: "3.11"
            coverage: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          # Hash-locked installs are safe to cache; the key follows both pin files.
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-build.lock
            requirements-ci.lock
      - name: Check requirements-build.lock matches the pyproject build-system pins
        run: |
          python - <<'PY'
          import re
          import tomllib
          from pathlib import Path
          declared = sorted(tomllib.loads(Path('pyproject.toml').read_text())['build-system']['requires'])
          locked = sorted(line.split()[0] for line in Path('requirements-build.lock').read_text().splitlines()
                          if re.match(r'^[A-Za-z0-9_.-]+==[^\s]+', line))
          # The lock may also pin the backends' own dependencies (wheel needs
          # packaging); every declared backend must appear at exactly its pin.
          missing = sorted(set(declared) - set(locked))
          assert not missing, f'requirements-build.lock is missing pyproject.toml build-system pins {missing} (locked: {locked})'
          PY
      - name: Install hash-locked build, runtime and development tools
        run: |
          # The runner's bootstrap pip verifies the pinned pip wheel before it
          # replaces itself. Every subsequently executed Python tool comes from
          # one of these reviewed SHA-256 locks.
          python -m pip install --require-hashes --only-binary=:all: \
            -r requirements-ci.lock -r requirements-build.lock -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Validate signature schemas and regular expressions
        run: python -m shadowscan.signatures.validate
      - run: ruff check shadowscan tests tools
      - run: ruff format --check shadowscan tests tools
      - run: mypy shadowscan tools/evaluation tools/canaries tools/acceptance tools/release
      - name: Check tracked files for hardcoded secrets
        run: |
          # Run the no-hardcoded-secrets pre-commit hook over every tracked file
          # it selects. A config with only the local hooks keeps pre-commit from
          # fetching the remote hook repositories; the hook's own file filters
          # (Python and YAML outside tests/ and signature data) still apply.
          python - "$RUNNER_TEMP/pre-commit-local.yaml" <<'PY'
          import sys
          from pathlib import Path

          import yaml

          config = yaml.safe_load(Path('.pre-commit-config.yaml').read_text(encoding='utf-8'))
          config['repos'] = [repo for repo in config['repos'] if repo['repo'] == 'local']
          Path(sys.argv[1]).write_text(yaml.safe_dump(config, sort_keys=False), encoding='utf-8')
          PY
          pre-commit run --config "$RUNNER_TEMP/pre-commit-local.yaml" --all-files no-hardcoded-secrets
      # Audit installed dependencies; the editable scanner is unpublished source,
      # so querying its version on PyPI is not a dependency vulnerability check.
      - run: pip-audit --skip-editable --progress-spinner off
      - name: Audit every hash-locked dependency set
        run: |
          # Fail if a locked package cannot be checked, even when an installed
          # environment audit permits an intentionally skipped editable package.
          for lock in requirements.lock requirements-build.lock requirements-ci.lock requirements-docs.lock; do
            pip-audit --require-hashes --strict --progress-spinner off \
              --disable-pip --no-deps -r "$lock"
          done
      - name: Run the test suite
        if: ${{ !matrix.coverage }}
        run: python -m pytest -q
      - name: Run the test suite with line and branch coverage
        if: ${{ matrix.coverage }}
        run: python -m pytest -q --cov=shadowscan --cov-report=term-missing --cov-fail-under=80
      - name: Enforce per-connector coverage floor
        if: ${{ matrix.coverage }}
        run: |
          python -m coverage json -o "$RUNNER_TEMP/shadowscan-coverage.json"
          python -m tools.coverage_gate "$RUNNER_TEMP/shadowscan-coverage.json"
      - name: Evaluate labeled detection cases
        run: |
          python -m tools.evaluation.evaluate --output "$RUNNER_TEMP/shadowscan-synthetic-evaluation.json"
          python -m tools.evaluation.evaluate --corpus tools/evaluation/public_corpus.json \
            --output "$RUNNER_TEMP/shadowscan-public-evaluation.json"
          # Multi-file cases; documented misses carry known_gap and do not fail the run.
          python -m tools.evaluation.evaluate --corpus tools/evaluation/realistic_corpus.json \
            --output "$RUNNER_TEMP/shadowscan-realistic-evaluation.json"
          python -m tools.evaluation.evaluate --corpus tools/evaluation/review_corpus.json \
            --output "$RUNNER_TEMP/shadowscan-review-evaluation.json"
          python -m tools.evaluation.evaluate --corpus tools/evaluation/field_review_corpus.json \
            --output "$RUNNER_TEMP/shadowscan-field-review-evaluation.json"
          python -m tools.evaluation.evaluate --corpus tools/evaluation/attribution_corpus.json \
            --output "$RUNNER_TEMP/shadowscan-attribution-evaluation.json"
          python -m tools.evaluation.evaluate --corpus tools/evaluation/current_idioms_corpus.json \
            --output "$RUNNER_TEMP/shadowscan-current-idioms-evaluation.json"
          python -m tools.evaluation.evaluate --corpus tools/evaluation/independent_corpus.json \
            --annotations tools/evaluation/independent_annotations.json \
            --output "$RUNNER_TEMP/shadowscan-independent-evaluation.json"
      - name: Build distributable wheel
        run: |
          # Re-assert the hash-locked backend so the wheel generator matches
          # pyproject.toml [build-system] after the combined locked install.
          python -m pip install --require-hashes --only-binary=:all: -r requirements-build.lock
          python -m pip wheel . --no-deps --no-build-isolation --wheel-dir dist
      - name: Validate installed wheel outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/shadowscan-wheel"
          "$RUNNER_TEMP/shadowscan-wheel/bin/python" -m pip install --require-hashes --only-binary=:all: -r requirements.lock
          "$RUNNER_TEMP/shadowscan-wheel/bin/python" -m pip install --no-deps dist/project_nexus_shadowscan-*.whl
          "$RUNNER_TEMP/shadowscan-wheel/bin/python" -m pip check
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/shadowscan-wheel/bin/python" -c 'from importlib.metadata import distribution; import shadowscan; package = distribution("project-nexus-shadowscan"); assert package.version == shadowscan.__version__; assert any(ep.name == "shadowscan" and ep.value == "shadowscan.cli:main" for ep in package.entry_points)'
          "$RUNNER_TEMP/shadowscan-wheel/bin/python" -m shadowscan.signatures.validate
          "$RUNNER_TEMP/shadowscan-wheel/bin/shadowscan" --help
      - name: Build and validate disposable worker
        if: matrix.python == '3.13'
        run: |
          set -euo pipefail
          # The literal Dockerfile FROM pins the reviewed multi-arch index.
          docker build --tag shadowscan:ci .
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --entrypoint python shadowscan:ci \
            -c 'import os, subprocess; assert os.geteuid() == 65532; subprocess.run(["python", "-m", "shadowscan.signatures.validate"], check=True)'
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --memory 1g --pids-limit 128 \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --mount "type=bind,source=$PWD/tests/fixtures/sample_repo,target=/input,readonly" \
            shadowscan:ci code /input --format json > "$RUNNER_TEMP/container-report.json"
          python -c 'import json, os, pathlib; report = json.loads((pathlib.Path(os.environ["RUNNER_TEMP"]) / "container-report.json").read_text()); assert report["summary"]["complete"] is True; assert report["findings"]'
      - name: Self-scan (demo, offline)
        run: shadowscan scan -c examples/shadowscan.offline.yaml --format sarif -o shadowscan.sarif
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: shadowscan-evaluation-${{ matrix.python }}
          path: ${{ runner.temp }}/shadowscan-*-evaluation.json
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && hashFiles('shadowscan.sarif') != ''
        with:
          name: shadowscan-sarif-${{ matrix.python }}
          path: shadowscan.sarif
          retention-days: 1
  gate:
    name: CI gate
    if: always()
    needs: [dco, docs, test-macos, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every applicable CI job
        env:
          EVENT_NAME: ${{ github.event_name }}
          DOCS_RESULT: ${{ needs.docs.result }}
          MACOS_RESULT: ${{ needs.test-macos.result }}
          TEST_RESULT: ${{ needs.test.result }}
          DCO_RESULT: ${{ needs.dco.result }}
        run: |
          python - <<'PY'
          import os
          import sys
          event = os.environ['EVENT_NAME']
          expected = {
              'DOCS_RESULT': 'success',
              'MACOS_RESULT': 'success',
              'TEST_RESULT': 'success',
          }
          if event == 'pull_request':
              expected['DCO_RESULT'] = 'success'
          elif event == 'push':
              expected['DCO_RESULT'] = 'skipped'
          else:
              sys.exit(f'unsupported CI event: {event}')
          failed = [f'{name}={os.environ.get(name)!r} (expected {value})'
                    for name, value in expected.items() if os.environ.get(name) != value]
          if failed:
              sys.exit('CI gate failed: ' + ', '.join(failed))
          print('All applicable CI jobs passed, including the complete Python matrix.')
          PY
