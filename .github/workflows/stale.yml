name: Stale issues

on:
  schedule:
    - cron: "0 6 * * 1"  # Monday 06:00 UTC
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@28ca1036281a5e5922ead5184a1bbf96e5fc984e # v9.0.0
        with:
          stale-issue-message: >
            This issue has been automatically marked as stale because it has
            not had recent activity. It will be closed in 14 days if no further
            activity occurs. If this issue is still relevant, please comment or
            remove the stale label.
          stale-pr-message: >
            This PR has been automatically marked as stale because it has not
            had recent activity. It will be closed in 14 days if no further
            activity occurs.
          days-before-stale: 60
          days-before-close: 14
          exempt-issue-labels: "security,pinned"
          exempt-pr-labels: "security,pinned"
          stale-issue-label: "stale"
          stale-pr-label: "stale"
