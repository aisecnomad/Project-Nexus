name: Stale issues

on:
  schedule:
    - cron: "0 6 * * 1"  # Monday 06:00 UTC
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          stale-issue-message: >
            This issue has been automatically marked as stale because it has
            not had recent activity. A maintainer will review it before closure.
            If this issue is still relevant, a short update helps with triage.
          stale-pr-message: >
            This PR has been automatically marked as stale because it has not
            had recent activity. It will remain open for maintainer review;
            contributors do not need to comment solely to prevent closure.
          days-before-stale: 60
          days-before-close: -1
          exempt-issue-labels: "security,pinned,bug,good first issue,help wanted"
          exempt-pr-labels: "security,pinned"
          exempt-draft-pr: true
          stale-issue-label: "stale"
          stale-pr-label: "stale"
