# Pre-commit hooks for ShadowScan development.
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: ^shadowscan/signatures/data/
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch=main]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      # ruff-format is not adopted yet: 173 files would be reformatted.

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.16.0
    hooks:
      - id: mypy
        files: ^shadowscan/
        additional_dependencies:
          - types-PyYAML
          - types-requests
        args: [--ignore-missing-imports]

  - repo: local
    hooks:
      - id: signature-validate
        name: Validate signature schemas
        entry: python -m shadowscan.signatures.validate
        language: system
        pass_filenames: false
        files: ^shadowscan/signatures/

      - id: no-hardcoded-secrets
        name: Check for hardcoded secret patterns
        entry: python tools/check_secrets.py
        language: system
        types: [python, yaml]
        exclude: ^(tests/fixtures/|shadowscan/signatures/data/)
