# Pre-commit hooks for ShadowScan development.
# Install the hash-locked toolchain and hooks: make install-hooks
# Run manually: pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      # Fixtures reproduce foreign files byte for byte and the retained licence
      # texts are digest-bound to their upstream copies; never rewrite them.
      - id: trailing-whitespace
        exclude: ^(tests/fixtures/|tools/evaluation/independent_licenses/)
      - id: end-of-file-fixer
        exclude: ^(tests/fixtures/|tools/evaluation/independent_licenses/)
      # mkdocs.yml uses Material's `!!python/name:` tags, which the safe loader
      # rejects; `mkdocs build --strict` in CI validates that file instead.
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: ^(shadowscan/signatures/data/|mkdocs\.yml$)
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key
        # Synthetic PEM markers exercise the redaction tests.
        exclude: ^tests/unit/test_redaction_security\.py$
      - id: no-commit-to-branch
        args: [--branch=main]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: a56c0b927e6465d37cae3e97d35d4d18ab2b96cd # v0.16.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # Keep the ruff and mypy version comments equal to the pins in
  # requirements-ci-constraints.txt so the hooks run the same versions as CI.
  # The immutable revs are the commits to which those reviewed tags resolve.
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: 7ff8d35ae36a7d2b968f2f90b4c723e292e594ee # v2.3.1
    hooks:
      - id: mypy
        files: ^(shadowscan|tools)/
        # The hook runs in its own environment. click ships its own types; without
        # it the decorated CLI is untyped and its `type: ignore` comments read as
        # unused. Keep this pin equal to requirements.lock.
        additional_dependencies:
          - click==8.5.0
          - types-PyYAML==6.0.12.20260906
          - types-requests==2.33.0.20260906
        args: [--ignore-missing-imports]

  - repo: local
    hooks:
      - id: signature-validate
        name: Validate signature schemas
        entry: python -m shadowscan.signatures.validate
        language: system
        pass_filenames: false
        files: ^shadowscan/signatures/

      - id: no-hardcoded-secrets
        name: Check for hardcoded secret patterns
        entry: python tools/check_secrets.py
        language: system
        # Every text file. Tests, fixtures, signature packs and evaluation
        # corpora hold synthetic credential-shaped strings on purpose; the
        # script skips them itself (EXCLUDED), so CI's run over `git ls-files`
        # applies the same list.
        types: [text]
