name: Claude
on:
  issue_comment:
    types: [created]
  schedule:
    - cron: "0 3 * * *"
jobs:
  claude:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allowed_tools: "Bash(*),Edit,Write"
