        patterns: ['\bChatAgent\s*\(', '\bAzureOpenAIResponsesClient\s*\(', '\bWorkflowBuilder\s*\(', '\bCreateAIAgent\s*\(', '\bAIAgent\b\s+\w+\s*=', '\bMagenticBuilder\s*\(', '\bHandoffBuilder\s*\(']
        weight: 0.85
      - type: user_agent
        patterns: ['(?i)agent-framework']
        weight: 0.8

