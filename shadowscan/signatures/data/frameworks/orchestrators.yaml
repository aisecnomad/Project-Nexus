  - id: framework.openai-agents-sdk
    name: OpenAI Agents SDK
    category: framework
    vendor: OpenAI
    homepage: https://openai.github.io/openai-agents-python/
    description: OpenAI's Agents SDK (Python and TypeScript) with handoffs, guardrails, tracing and hosted tools.
    capabilities: [tool-use]
    agent_indicator: true
    signals:
      - type: code
        description: Hand-offs between agents
        patterns: ['\bhandoff\s*\(', '\bhandoffs\s*[=:]\s*\[']
        weight: 0.6
        capabilities: [multi-agent]
      - type: dependency
        ecosystem: pypi
        names: [openai-agents]
        weight: 0.97
      - type: dependency
        ecosystem: npm
        names: ["@openai/agents", "@openai/agents-core", "@openai/agents-openai", "@openai/agents-realtime", "@openai/agents-extensions"]
        prefixes: ["@openai/agents"]
        weight: 0.97
      - type: import
        languages: [python]
        patterns: ['^[^\S\r\n]*from\s+agents(?:\.[a-z_.]+)?\s+import\s+[^\n]*\b(?:Agent|Runner|function_tool|handoff|WebSearchTool|ComputerTool|FileSearchTool|CodeInterpreterTool|Guardrail|RunConfig|trace)\b', '^[^\S\r\n]*import\s+agents\s*$']
        weight: 0.9
      - type: import
        languages: [javascript]
        patterns: ['from\s+["'']@openai/agents']
        weight: 0.97
      - type: code
        # new Agent({ name: ... }) is shared with Mastra and others and is covered
        # by heuristic.agent-construction.
        patterns: ['\bRunner\.run(?:_sync|_streamed|Sync)?\s*\(', '@function_tool\b', '\bhandoffs\s*=\s*\[', '\bAgent\s*\(\s*name\s*=\s*["''][^"'']+["'']\s*,\s*instructions\s*=']
        weight: 0.85
      - type: code
