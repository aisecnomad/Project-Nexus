        patterns: ['\bgpte\s+(?:-i\s+)?[\w./-]+', '\bgpt-engineer\s+[\w./-]+']
        weight: 0.6

  - id: framework.open-interpreter
    name: Open Interpreter
    category: framework
    vendor: Open Interpreter
    homepage: https://openinterpreter.com
    description: Runs model-generated code locally through a chat interface; auto_run disables confirmation.
    capabilities: [code-exec, autonomous]
    agent_indicator: true
    signals:
      - type: dependency
        ecosystem: pypi
        names: [open-interpreter]
        weight: 0.95
      - type: import
        languages: [python]
        patterns: ['^[^\S\r\n]*from\s+interpreter\s+import\s+(?:interpreter|OpenInterpreter)\b']
        weight: 0.9
      - type: code
        patterns: ['\binterpreter\.auto_run\s*=\s*True', '\bOpenInterpreter\s*\(', '\binterpreter\s+(?:-y|--auto_run|--os)\b']
        weight: 0.85

  - id: framework.chainlit
    name: Chainlit
    category: framework
    vendor: Chainlit
    homepage: https://chainlit.io
    description: Python framework for conversational LLM front-ends; the app behind it may or may not be an agent.
    signals:
      - type: dependency
        ecosystem: pypi
        names: [chainlit]
        weight: 0.8
      - type: import
        languages: [python]
        patterns: ['^[^\S\r\n]*(?:from|import)\s+chainlit\b']
        weight: 0.8
      - type: code
        patterns: ['@cl\.on_(?:message|chat_start|chat_resume|audio_chunk|stop)\b', '\bcl\.Message\s*\(', '\bchainlit\s+run\b']
        weight: 0.7
      - type: file
        globs: [".chainlit/config.toml", "**/.chainlit/config.toml", "chainlit.md", "**/chainlit.md"]
        weight: 0.8
      - type: env
        names: [CHAINLIT_AUTH_SECRET, CHAINLIT_API_KEY, CHAINLIT_URL]
        weight: 0.6

  - id: framework.promptflow
    name: Microsoft Prompt flow
    category: framework
    vendor: Microsoft
    homepage: https://microsoft.github.io/promptflow/
    description: DAG / flex flows of LLM calls and Python tools, run locally or on Azure AI Foundry.
    capabilities: [tool-use]
    signals:
      - type: dependency
        ecosystem: pypi
        names: [promptflow, promptflow-core, promptflow-devkit, promptflow-azure, promptflow-tools, promptflow-tracing, promptflow-evals]
        prefixes: [promptflow-]
        weight: 0.85
      - type: import
        languages: [python]
        patterns: ['^[^\S\r\n]*(?:from|import)\s+promptflow\b']
        weight: 0.85
      - type: code
        patterns: ['azuremlschemas\.azureedge\.net/promptflow/', '\bpf\s+(?:flow|run|connection)\s+(?:test|serve|create|build|init)\b']
        weight: 0.8
      - type: file
        globs: ["flow.dag.yaml", "**/flow.dag.yaml", "flow.flex.yaml", "**/flow.flex.yaml"]
        weight: 0.9

  # ----------------------------------------------------------- guardrails
  - id: framework.guardrails-ai
    name: Guardrails AI
    category: framework
    vendor: Guardrails AI
    homepage: https://www.guardrailsai.com
    description: Input / output validation layer for LLM applications (validators from Guardrails Hub); corroborates an LLM application, never an agent on its own.
    signals:
      - type: dependency
        ecosystem: pypi
        names: [guardrails-ai, guardrails-hub-types]
        weight: 0.7
      - type: import
        languages: [python]
        patterns: ['^[^\S\r\n]*from\s+guardrails\s+import\s+[^\n]*\b(?:Guard|AsyncGuard|OnFailAction|install)\b', '^[^\S\r\n]*from\s+guardrails\.hub\s+import\b']
        weight: 0.7
      - type: code
        patterns: ['\bGuard\s*\(\s*\)\s*\.use\s*\(', '\bGuard\.from_(?:pydantic|rail|string)\s*\(', '\bguardrails\s+hub\s+install\b']
        weight: 0.7
      - type: env
        names: [GUARDRAILS_API_KEY, GUARDRAILS_TOKEN]
        weight: 0.6
      - type: domain
        values: [api.guardrailsai.com, hub.guardrailsai.com]
        weight: 0.8

  - id: framework.nemo-guardrails
    name: NVIDIA NeMo Guardrails
    category: framework
    vendor: NVIDIA
    homepage: https://github.com/NVIDIA/NeMo-Guardrails
    description: Programmable (Colang) guardrails wrapped around LLM calls; corroborates an LLM application.
    signals:
      - type: dependency
        ecosystem: pypi
        names: [nemoguardrails]
        weight: 0.7
      - type: import
        languages: [python]
        patterns: ['^[^\S\r\n]*(?:from|import)\s+nemoguardrails\b']
        weight: 0.7
      - type: code
        patterns: ['\bRailsConfig\.from_(?:path|content)\s*\(', '\bLLMRails\s*\(', '\bRunnableRails\s*\(']
        weight: 0.7

  - id: framework.llm-guard
    name: LLM Guard
    category: framework
    vendor: Protect AI
    homepage: https://llm-guard.com
    description: Prompt / output scanners (injection, PII, secrets) for LLM applications; corroborates an LLM application.
    signals:
      - type: dependency
        ecosystem: pypi
        names: [llm-guard]
        weight: 0.7
      - type: import
        languages: [python]
        patterns: ['^[^\S\r\n]*(?:from|import)\s+llm_guard\b']
        weight: 0.7
      - type: code
        patterns: ['\bscan_prompt\s*\(\s*input_scanners\b', '\bscan_output\s*\(\s*output_scanners\b']
        weight: 0.7
      - type: image
        patterns: ['laiyer/llm-guard-api', 'protectai/llm-guard-api']
        weight: 0.85
