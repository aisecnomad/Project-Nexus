    name: Microsoft Agent Framework
    category: framework
    vendor: Microsoft
    homepage: https://github.com/microsoft/agent-framework
    description: Microsoft's unified agent framework (successor to Semantic Kernel Agents and AutoGen) for .NET and Python, with workflows, A2A and Azure AI Foundry integration.
    capabilities: [tool-use, multi-agent]
    agent_indicator: true
    signals:
      - type: dependency
        ecosystem: pypi
        names: [agent-framework, agent-framework-core, agent-framework-azure-ai, agent-framework-openai, agent-framework-foundry, agent-framework-copilotstudio, agent-framework-a2a, agent-framework-mem0, agent-framework-redis, agent-framework-devui, agent-framework-anthropic, agent-framework-ollama]
        prefixes: [agent-framework]
        weight: 0.97
      - type: dependency
        ecosystem: nuget
        names: ["Microsoft.Agents.AI", "Microsoft.Agents.AI.OpenAI", "Microsoft.Agents.AI.AzureAI", "Microsoft.Agents.AI.Workflows", "Microsoft.Agents.AI.A2A", "Microsoft.Agents.AI.Abstractions", "Microsoft.Agents.AI.CopilotStudio"]
        prefixes: ["Microsoft.Agents.AI"]
        weight: 0.97
      - type: import
        languages: [python]
        patterns: ['^[^\S\r\n]*(?:from|import)\s+agent_framework\b']
        weight: 0.97
      - type: import
        languages: [dotnet]
        patterns: ['^[^\S\r\n]*using\s+Microsoft\.Agents\.AI\b']
        weight: 0.97
      - type: code
        # AzureAIAgentClient( targets Azure AI Foundry Agents and is claimed there;
