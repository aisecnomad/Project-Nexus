        patterns: ['\bComputerTool\s*\(', '\bLocalShellTool\s*\(']
        weight: 0.6
        capabilities: [code-exec]
      - type: user_agent
        patterns: ['(?i)openai-agents', '(?i)Agents/Python', '(?i)agents-sdk']
        weight: 0.85

