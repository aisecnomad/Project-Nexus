# Agent orchestration frameworks (Python / JavaScript first-class).
#
# Weight guidance:
#   0.9+  unambiguous (dedicated package / config file / agent class)
#   0.6-0.85 strong (import of framework namespace)
#   0.3-0.5  supporting (env var, generic idiom)
signatures:
  - id: framework.langchain
    name: LangChain
    category: framework
    vendor: LangChain, Inc.
    homepage: https://python.langchain.com
    description: LLM application framework with agents, tools, chains and integrations.
    capabilities: [tool-use]
    agent_indicator: false
    signals:
      - type: dependency
        ecosystem: pypi
        names: [langchain, langchain-core, langchain-community, langchain-classic, langchain-experimental, langchain-openai, langchain-anthropic, langchain-google-genai, langchain-google-vertexai, langchain-aws, langchain-mistralai, langchain-cohere, langchain-groq, langchain-ollama, langchain-huggingface, langchain-mcp-adapters, langchain-text-splitters]
        prefixes: [langchain]
        weight: 0.85
      - type: dependency
        ecosystem: npm
        names: [langchain, "@langchain/core", "@langchain/community", "@langchain/openai", "@langchain/anthropic", "@langchain/google-genai", "@langchain/google-vertexai", "@langchain/aws", "@langchain/mcp-adapters"]
        prefixes: ["@langchain/"]
        weight: 0.85
      - type: import
        languages: [python]
        patterns: ['^\s*(?:from|import)\s+langchain(?:_[a-z0-9_]+)?\b']
        weight: 0.85
      - type: import
        languages: [javascript]
        patterns: ['from\s+["'']@?langchain(?:/[^"'']+)?["'']', 'require\(\s*["'']@?langchain']
        weight: 0.85
      - type: code
        patterns: ['\bAgentExecutor\s*\(', '\binitialize_agent\s*\(', '\bcreate_(?:react|tool_calling|openai_tools|openai_functions|structured_chat|json_chat|xml|self_ask_with_search|conversational_retrieval|sql)_agent\s*\(', '\bcreate_agent\s*\(', '\bcreateReactAgent\s*\(', '\bcreateToolCallingAgent\s*\(', '\bAgentType\.']
        weight: 0.9
        agent_indicator: true
        capabilities: [tool-use]
      - type: code
        patterns: ['\bPythonREPL(?:Tool)?\s*\(', '\bShellTool\s*\(', '\bBashProcess\s*\(', '\bPythonAstREPLTool\s*\(']
        weight: 0.6
        agent_indicator: true
        capabilities: [code-exec]
      - type: code
        patterns: ['\bConversationBufferMemory\s*\(', '\bConversationSummaryMemory\s*\(', '\bMemorySaver\s*\(']
        weight: 0.4
        capabilities: [memory]
      - type: code
        patterns: ['\b(?:StructuredTool|Tool)\s*\(\s*name\s*=', '\bStructuredTool\.from_function\s*\(', '@tool\s*(?:\(|\n)']
        weight: 0.5
        capabilities: [tool-use]
      - type: env
        names: [LANGCHAIN_API_KEY, LANGCHAIN_TRACING_V2, LANGCHAIN_PROJECT, LANGCHAIN_ENDPOINT]
        weight: 0.5
      - type: user_agent
        patterns: ['(?i)\blangchain\b']
        weight: 0.8

