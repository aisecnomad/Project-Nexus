# Agent orchestration frameworks (Python / JavaScript first-class).
#
# Weight guidance:
#   0.9+  unambiguous (dedicated package / config file / agent class)
#   0.6-0.85 strong (import of framework namespace)
#   0.3-0.5  supporting (env var, generic idiom)
signatures:
  - id: framework.langchain
    name: LangChain
    category: framework
    vendor: LangChain, Inc.
    homepage: https://python.langchain.com
    description: LLM application framework with agents, tools, chains and integrations.
    capabilities: [tool-use]
    agent_indicator: false
    signals:
      # Every langchain-* partner package counts as framework usage except the
      # pure text utilities (see framework.langchain-utilities); LangGraph's
      # npm packages live under the @langchain scope and are claimed there.
      - type: dependency
        ecosystem: pypi
        names: [langchain, langchainhub]
        prefixes: [langchain-]
        exclude_names: [langchain-text-splitters]
        weight: 0.85
      - type: dependency
        ecosystem: npm
        names: [langchain]
        prefixes: ["@langchain/"]
        exclude_names: ["@langchain/textsplitters"]
        exclude_prefixes: ["@langchain/langgraph"]
        weight: 0.85
      - type: import
        languages: [python]
        patterns: ['^[^\S\r\n]*(?:from|import)\s+langchain(?!_text_splitters\b)(?:_[a-z0-9_]+)?\b']
        weight: 0.85
      - type: import
        languages: [javascript]
        patterns: ['from\s+["'']@?langchain(?!/textsplitters\b)(?:/[^"'']+)?["'']', 'require\(\s*["'']@?langchain(?!/textsplitters\b)']
        weight: 0.85
      - type: code
        patterns: ['\bAgentExecutor\s*\(', '\binitialize_agent\s*\(', '\bcreate_(?:react|tool_calling|openai_tools|openai_functions|structured_chat|json_chat|xml|self_ask_with_search|conversational_retrieval|sql)_agent\s*\(', '(?<!def )\bcreate_agent\s*\(', '\bcreateReactAgent\s*\(', '\bcreateToolCallingAgent\s*\(', '\bAgentType\.']
        weight: 0.9
        agent_indicator: true
        capabilities: [tool-use]
      - type: code
        patterns: ['\bPythonREPL(?:Tool)?\s*\(', '\bShellTool\s*\(', '\bBashProcess\s*\(', '\bPythonAstREPLTool\s*\(']
        weight: 0.6
        agent_indicator: true
        capabilities: [code-exec]
      - type: code
        # MemorySaver( is a LangGraph checkpointer and is claimed there.
        patterns: ['\bConversationBufferMemory\s*\(', '\bConversationSummaryMemory\s*\(']
        weight: 0.4
        capabilities: [memory]
      - type: code
        patterns: ['\b(?:StructuredTool|Tool)\s*\(\s*name\s*=', '\bStructuredTool\.from_function\s*\(']
        weight: 0.5
        capabilities: [tool-use]
      - type: env
        names: [LANGCHAIN_API_KEY, LANGCHAIN_TRACING_V2, LANGCHAIN_PROJECT, LANGCHAIN_ENDPOINT]
        weight: 0.5
      - type: user_agent
        patterns: ['(?i)\blangchain\b']
        weight: 0.8

  - id: framework.langchain-utilities
    name: LangChain text utilities
    category: framework
    vendor: LangChain, Inc.
    description: Stand-alone LangChain utility packages (text splitters) that do not call models or tools; weak evidence of an LLM application, never of an agent.
    agent_indicator: false
    signals:
      - type: dependency
        ecosystem: pypi
        names: [langchain-text-splitters]
        weight: 0.3
      - type: dependency
        ecosystem: npm
        names: ["@langchain/textsplitters"]
        weight: 0.3
      - type: import
        languages: [python]
        patterns: ['^[^\S\r\n]*(?:from|import)\s+langchain_text_splitters\b']
        weight: 0.3
      - type: import
        languages: [javascript]
        patterns: ['from\s+["'']@langchain/textsplitters["'']']
        weight: 0.3

  - id: framework.langgraph
    name: LangGraph
    category: framework
    vendor: LangChain, Inc.
    homepage: https://langchain-ai.github.io/langgraph/
    description: Graph-based stateful multi-actor agent runtime (LangGraph, LangGraph Platform).
    capabilities: [tool-use]
    agent_indicator: true
    signals:
      - type: dependency
        ecosystem: pypi
        names: [langgraph, langgraph-cli, langgraph-sdk, langgraph-api, langgraph-checkpoint, langgraph-checkpoint-postgres, langgraph-checkpoint-sqlite, langgraph-prebuilt, langgraph-supervisor, langgraph-swarm]
        prefixes: [langgraph]
        weight: 0.95
      - type: dependency
        ecosystem: npm
        names: ["@langchain/langgraph", "@langchain/langgraph-sdk", "@langchain/langgraph-cli", "@langchain/langgraph-checkpoint", "@langchain/langgraph-supervisor", "@langchain/langgraph-swarm"]
        prefixes: ["@langchain/langgraph"]
        weight: 0.95
      - type: import
        languages: [python]
        patterns: ['^[^\S\r\n]*(?:from|import)\s+langgraph\b']
        weight: 0.95
      - type: import
        languages: [javascript]
        patterns: ['from\s+["'']@langchain/langgraph']
        weight: 0.95
      - type: code
        patterns: ['\bStateGraph\s*\(', '\bcreate_react_agent\s*\(', '\bcreate_supervisor\s*\(', '\bcreate_swarm\s*\(', '\bMessagesState\b', '\bCompiledStateGraph\b']
        weight: 0.9
      - type: code
        patterns: ['\binterrupt_before\s*=\s*\[\s*\]', '\bMemorySaver\s*\(', '\bPostgresSaver\b', '\bcheckpointer\s*=']
        weight: 0.4
        capabilities: [memory]
      - type: file
        globs: ["langgraph.json", "**/langgraph.json"]
        weight: 0.98
      - type: image
        patterns: ['langchain/langgraph-api', 'langchain/langgraphjs-api']
        weight: 0.95
      - type: env
        names: [LANGGRAPH_API_KEY, LANGGRAPH_CLOUD_LICENSE_KEY, LANGGRAPH_AUTH_TYPE]
        weight: 0.6
      - type: user_agent
        patterns: ['(?i)\blanggraph\b']
        weight: 0.85

  - id: framework.llamaindex
    name: LlamaIndex
    category: framework
    vendor: LlamaIndex Inc.
    homepage: https://www.llamaindex.ai
    description: Data framework with agents, workflows and RAG pipelines (LlamaIndex, LlamaCloud, llama-deploy).
    capabilities: [tool-use, rag]
    signals:
      - type: dependency
        ecosystem: pypi
        names: [llama-index, llama-index-core, llama-index-agent-openai, llama-index-llms-openai, llama-index-llms-anthropic, llama-index-llms-bedrock-converse, llama-index-llms-vertex, llama-index-tools-mcp, llama-deploy, llama-agents, llama-cloud, llama-cloud-services, llama-parse]
        prefixes: [llama-index, llama-cloud]
        weight: 0.85
      - type: dependency
        ecosystem: npm
        names: [llamaindex, "@llamaindex/core", "@llamaindex/openai", "@llamaindex/workflow", "@llamaindex/tools"]
        prefixes: ["@llamaindex/"]
        weight: 0.85
      - type: import
        languages: [python]
        patterns: ['^[^\S\r\n]*(?:from|import)\s+llama_index\b', '^[^\S\r\n]*(?:from|import)\s+llama_deploy\b', '^[^\S\r\n]*(?:from|import)\s+llama_agents\b']
        weight: 0.85
      - type: import
        languages: [javascript]
        patterns: ['from\s+["'']@?llamaindex']
        weight: 0.85
      - type: code
        patterns: ['\b(?:ReActAgent|FunctionAgent|FunctionCallingAgent|OpenAIAgent|AgentWorkflow|CodeActAgent|AgentRunner)\s*(?:\(|\.from_tools)', '\bagent\s*=\s*(?:ReActAgent|FunctionAgent)\b']
        weight: 0.9
        agent_indicator: true
      - type: code
        patterns: ['\bCodeActAgent\b']
        weight: 0.5
        capabilities: [code-exec]
      - type: env
        names: [LLAMA_CLOUD_API_KEY]
        weight: 0.6
      - type: domain
        values: [api.cloud.llamaindex.ai, cloud.llamaindex.ai]
        weight: 0.7
      - type: user_agent
        patterns: ['(?i)llama[-_ ]?index']
        weight: 0.8

  - id: framework.crewai
    name: CrewAI
    category: framework
    vendor: CrewAI Inc.
    homepage: https://www.crewai.com
    description: Role-playing multi-agent framework (crews, flows) with CrewAI Enterprise (AMP) hosting.
    capabilities: [tool-use, multi-agent]
    agent_indicator: true
    signals:
      - type: dependency
        ecosystem: pypi
        names: [crewai, crewai-tools]
        prefixes: [crewai]
        weight: 0.97
      - type: import
        languages: [python]
        patterns: ['^[^\S\r\n]*(?:from|import)\s+crewai\b']
        weight: 0.97
      - type: code
        patterns: ['\bCrew\s*\(', '@CrewBase\b', '\bcrew\s*\(\s*\)\s*\.kickoff', '\.kickoff(?:_async|_for_each)?\s*\(', '\bAgent\s*\(\s*role\s*=', '\bLLM\s*\(\s*model\s*=', '\bFlow\[[A-Za-z_]+\]']
        weight: 0.9
      - type: code
        # CodeInterpreterTool( is shared by several SDKs (heuristic.code-execution).
        patterns: ['\ballow_code_execution\s*=\s*True']
        weight: 0.6
        capabilities: [code-exec]
      - type: file
        globs: ["**/config/agents.yaml", "**/config/tasks.yaml", "**/crew.py"]
        weight: 0.75
      - type: env
        names: [CREWAI_API_KEY, CREWAI_TRACING_ENABLED, CREWAI_PLUS_URL]
        weight: 0.6
      - type: domain
        values: [app.crewai.com, telemetry.crewai.com]
        weight: 0.7
      - type: user_agent
        patterns: ['(?i)\bcrewai\b']
        weight: 0.85

  - id: framework.google-adk
    name: Google Agent Development Kit (ADK)
    category: framework
    vendor: Google
    homepage: https://google.github.io/adk-docs/
    description: Google's open-source Agent Development Kit for building and deploying agents (Python, Java, Go); deploys to Vertex AI Agent Engine, Cloud Run, GKE.
    capabilities: [tool-use, multi-agent]
    agent_indicator: true
    signals:
      - type: dependency
        ecosystem: pypi
        names: [google-adk]
        weight: 0.97
      - type: dependency
        ecosystem: maven
        names: ["com.google.adk:google-adk", "com.google.adk:google-adk-dev"]
        prefixes: ["com.google.adk"]
        weight: 0.97
      - type: dependency
        ecosystem: go
        names: ["google.golang.org/adk"]
        prefixes: ["google.golang.org/adk"]
        weight: 0.97
      - type: dependency
        ecosystem: npm
        names: ["@google/adk", "@iqai/adk"]
        weight: 0.9
      - type: import
        languages: [python]
        patterns: ['^[^\S\r\n]*(?:from|import)\s+google\.adk\b']
        weight: 0.97
      - type: import
        languages: [java]
        patterns: ['^[^\S\r\n]*import\s+com\.google\.adk\.']
        weight: 0.97
      - type: import
        languages: [go]
        patterns: ['"google\.golang\.org/adk(?:/[^"]+)?"']
        weight: 0.97
      - type: code
        patterns: ['\b(?:LlmAgent|SequentialAgent|ParallelAgent|LoopAgent)\s*\(', '\broot_agent\s*=\s*(?:LlmAgent|Agent)\s*\(', '\bInMemoryRunner\s*\(', '\bRunner\s*\(\s*(?:agent|app_name)\s*=', '\bagent_engines\.create\s*\(']
        weight: 0.9
      - type: code
        patterns: ['\bBuiltInCodeExecutor\s*\(', '\bcode_executor\s*=']
        weight: 0.5
        capabilities: [code-exec]
      - type: file
        globs: ["**/.adk/**", "**/agent_engine_app.py"]
        weight: 0.6
      - type: env
        names: [GOOGLE_GENAI_USE_VERTEXAI, ADK_API_KEY]
        weight: 0.4
      - type: user_agent
        patterns: ['(?i)google-adk', '(?i)\badk/\d']
        weight: 0.85

  - id: framework.aws-strands
    name: AWS Strands Agents
    category: framework
    vendor: Amazon Web Services
    homepage: https://strandsagents.com
    description: Model-driven agent SDK from AWS (Strands Agents) with tools, MCP support and Bedrock AgentCore deployment.
    capabilities: [tool-use, multi-agent]
    agent_indicator: true
    signals:
      - type: dependency
        ecosystem: pypi
        names: [strands-agents, strands-agents-tools, strands-agents-builder, strands-agents-evals]
        prefixes: [strands-agents]
        weight: 0.97
      - type: import
        languages: [python]
        patterns: ['^[^\S\r\n]*(?:from|import)\s+strands(?:_tools)?\b']
        weight: 0.95
      - type: code
        # A bare Agent(model=...) constructor is shared by Agno, Pydantic AI and
        # others and is covered by heuristic.agent-construction.
        patterns: ['\bfrom\s+strands\s+import\s+Agent\b', '\bBedrockModel\s*\(', '\bstrands_tools\b', '\bGraphBuilder\s*\(', '\bSwarm\s*\(\s*\[']
        weight: 0.8
      - type: code
        patterns: ['\bfrom\s+strands_tools\s+import\s+[^\n]*\b(?:shell|python_repl|editor|file_write)\b']
        weight: 0.7
        capabilities: [code-exec]
      - type: user_agent
        patterns: ['(?i)strands-agents']
        weight: 0.9

