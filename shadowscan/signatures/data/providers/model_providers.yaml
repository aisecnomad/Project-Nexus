  - id: provider.openai-compatible
    name: OpenAI-compatible endpoint override
    category: provider
    vendor: null
    description: Client configured with a non-default base URL, typically a self-hosted or third-party OpenAI-compatible server (LM Studio, LocalAI, vLLM, TGI, LiteLLM...).
    signals:
      - type: code
        patterns: ['\bbase_url\s*=\s*["'']https?://(?!api\.openai\.com)[^"'']+/v1["'']', '\bbaseURL\s*:\s*["'']https?://(?!api\.openai\.com)[^"'']+/v1["'']', '\bopenai\.api_base\s*=\s*["'']https?://(?!api\.openai\.com)']
        weight: 0.6
      - type: domain
        values: ["re:.*:1234$", "re:.*:8080/v1$", "re:.*:8000/v1$", "re:.*:4000$"]
        weight: 0.3
      - type: env
        names: [OPENAI_API_HOST, LLM_BASE_URL, LLM_API_BASE, OPENAI_COMPAT_BASE_URL]
        weight: 0.5

