# Model providers / inference APIs. Presence of a provider SDK proves LLM use,
# not necessarily an agent; agent_indicator stays false unless the signal is an
# agent-specific API (Assistants, Responses with tools, Bedrock Agents...).
#
# `secret` patterns are matched against file contents; connectors redact the
# match before storing it as evidence.
signatures:
  - id: provider.openai
    name: OpenAI
    category: provider
    vendor: OpenAI
    homepage: https://platform.openai.com
    signals:
      - type: dependency
        ecosystem: pypi
        names: ["langchain-openai", "llama-index-llms-openai"]
        weight: 0.75
        description: Framework integration package for this provider
      - type: dependency
        ecosystem: npm
        names: ["@langchain/openai", "@ai-sdk/openai"]
        weight: 0.75
        description: Framework integration package for this provider
      - type: import
        languages: [python]
        patterns: ['^[^\S\r\n]*(?:from|import)\s+(?:langchain_openai|llama_index\.llms\.openai)\b']
        weight: 0.75
      - type: import
        languages: [javascript]
        patterns: ['from\s+["'']@?(?:langchain/openai|ai-sdk/openai)["'']']
        weight: 0.75
      - type: code
        description: n8n model node
        patterns: ['\bn8n-nodes-langchain\.(?:lmChatOpenAi|lmOpenAi|embeddingsOpenAi|openAi)\b']
        weight: 0.8
      - type: dependency
        ecosystem: pypi
        names: [openai]
        weight: 0.8
      - type: dependency
        ecosystem: npm
        names: [openai]
        weight: 0.8
      - type: dependency
        ecosystem: go
        names: ["github.com/openai/openai-go", "github.com/sashabaranov/go-openai"]
        weight: 0.8
      - type: dependency
        ecosystem: cargo
        names: [async-openai, openai-api-rs, openai]
        weight: 0.8
      - type: dependency
        ecosystem: maven
        names: ["com.openai:openai-java", "com.theokanning.openai-gpt3-java:service", "com.theokanning.openai-gpt3-java:client"]
        prefixes: ["com.openai"]
        weight: 0.8
      - type: dependency
        ecosystem: nuget
        names: [OpenAI, "OpenAI-DotNet", Betalgo.OpenAI, "Betalgo.Ranul.OpenAI"]
        weight: 0.8
      - type: dependency
        ecosystem: rubygems
        names: [ruby-openai, openai]
        weight: 0.8
      - type: dependency
        ecosystem: composer
        names: [openai-php/client, openai-php/laravel]
        weight: 0.8
      - type: import
        languages: [python]
        patterns: ['^[^\S\r\n]*(?:from|import)\s+openai\b']
        weight: 0.8
      - type: import
        languages: [javascript]
        patterns: ['from\s+["'']openai(?:/[^"'']+)?["'']', 'require\(\s*["'']openai["'']\s*\)']
        weight: 0.8
      - type: import
        languages: [go]
        patterns: ['"github\.com/(?:openai/openai-go|sashabaranov/go-openai)']
        weight: 0.8
      - type: import
        languages: [dotnet]
        patterns: ['^[^\S\r\n]*using\s+OpenAI\b']
        weight: 0.7
      - type: code
        patterns: ['\bchat\.completions\.create\s*\(', '\bresponses\.create\s*\(', '\bclient\.beta\.assistants\.create\s*\(', '\bbeta\.threads\.runs\.create\s*\(']
        weight: 0.7
      - type: code
        patterns: ['\bassistants\.create\s*\(', '"type"\s*:\s*"code_interpreter"', '"type"\s*:\s*"file_search"', '"type"\s*:\s*"computer_use_preview"', '"type"\s*:\s*"web_search_preview"']
        weight: 0.8
        agent_indicator: true
        capabilities: [tool-use]
      - type: env
        names: [OPENAI_API_KEY, OPENAI_ORG_ID, OPENAI_ORGANIZATION, OPENAI_BASE_URL, OPENAI_API_BASE, OPENAI_PROJECT_ID, OPENAI_ADMIN_KEY]
        weight: 0.6
      - type: domain
        values: [api.openai.com, "*.api.openai.com"]
        weight: 0.9
      - type: user_agent
        patterns: ['(?i)\bOpenAI/(?:Python|JS|NET|Go|Java|Ruby)', '(?i)openai-(?:python|node|go|java|ruby|dotnet)', '(?i)\bAsyncOpenAI\b']
        weight: 0.7
      - type: model
        patterns: ['^(?:gpt-|o1|o3|o4|chatgpt-|text-embedding-|dall-e|whisper|tts-|davinci|babbage|computer-use-preview|codex-)']
        weight: 0.8
      - type: secret
        # Only OpenAI-specific shapes: the project / service-account / admin
        # prefixes, or the base64 "OpenAI" marker (T3BlbkFJ) that every OpenAI
        # key carries. Other sk- keys (Anthropic, OpenRouter, Langfuse, LiteLLM,
        # DeepSeek, DashScope, Moonshot) are claimed by their own signatures or
        # by heuristic.unattributed-api-key.
        patterns: ['\bsk-(?:proj|svcacct|admin)-[A-Za-z0-9_-]{32,}\b', '\bsk-[A-Za-z0-9]{20}T3BlbkFJ[A-Za-z0-9]{20,}\b']
        weight: 0.9
        description: OpenAI API key

