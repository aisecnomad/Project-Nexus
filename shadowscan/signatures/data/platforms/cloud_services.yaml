        weight: 0.95
      - type: iac
        values: [oci_generative_ai_agent_agent, oci_generative_ai_agent_agent_endpoint, oci_generative_ai_agent_knowledge_base, oci_generative_ai_agent_data_source, oci_generative_ai_agent_tool, oci_generative_ai_agent_data_ingestion_job, oci_oda_oda_instance, oci_oda_oda_private_endpoint]
        weight: 0.97
      - type: scope
        values: ["generative-ai-agent-family", "generative-ai-agent", "generative-ai-agent-endpoint", "generative-ai-agent-knowledge-base", "generative-ai-agent-session", "generative-ai-agent-tool", "oda-family", "oda-instances"]
        weight: 0.9
      - type: name
        patterns: ['(?i)\bgenerative ai agents?\b', '(?i)\bdigital assistant\b', '(?i)\boda\b']
        weight: 0.6

  - id: cloud.kubernetes-agent-workloads
    name: Agent workloads on Kubernetes / containers
    category: cloud-service
    vendor: null
    description: Container images and Helm charts for agent platforms, gateways and self-hosted model servers.
    signals:
      - type: code
        patterns: ['^[^\S\r\n]*kind:\s*(?:Deployment|StatefulSet|Job|CronJob|Pod)\s*$']
        weight: 0.05
      - type: image
        # Images of products with their own signature (LiteLLM, LocalAI,
        # llama.cpp, LM Studio) are attributed there, not here.
        patterns: ['kagent-dev/kagent', 'ghcr\.io/kagent-dev', 'agentgateway/agentgateway', 'kgateway', 'ghcr\.io/nvidia/nemo', 'nvcr\.io/nvidia/nemo', 'ghcr\.io/kubeflow/', 'ray-project/ray', 'triton', 'text-generation-inference', 'ghcr\.io/open-webui', 'ghcr\.io/coollabsio', 'anythingllm', 'langgenius', 'flowiseai', 'langflowai', 'n8nio', 'portkeyai']
        weight: 0.85
