  - id: identity-app.meeting-notetakers
    name: AI meeting note-takers (Otter, Fireflies, Read.ai, Fathom, tl;dv, Gong, Avoma, Fellow, Grain, Krisp, Zoom AI Companion, Sembly, Supernormal, Circleback, Granola)
    category: identity-app
    vendor: null
    tags: [meeting-bot]
    description: Bots that join meetings, record and transcribe them and read calendars; frequent source of shadow AI in Google Workspace / Microsoft 365 consent grants.
    agent_indicator: true
    risk_notes: ["Meeting bots capture confidential conversations and often request calendar and mail scopes."]
    signals:
      - type: name
        # Otter, Gong, Grain, Fathom, Fellow, Granola, Bluedot and Jamie are
        # words / names: the bare word counts as the whole display name (Jamie
        # excepted) or with meeting context on the same line.
        patterns: ['(?i)\botter\.?ai\b', '(?i)^(?=.*\b(?:ai|meetings?|notes?|note[- ]?taker|transcri\w*|record\w*|zoom|teams|meet|calendar|assistant|bot|calls?|conversations?)\b).*\botter\b|^[^\S\r\n]*otter[^\S\r\n]*$', '(?i)\bfireflies(?:\.ai)?\b', '(?i)\bread\.?ai\b', '(?i)\bfathom\.video\b', '(?i)^(?=.*\b(?:ai|meetings?|notes?|note[- ]?taker|transcri\w*|record\w*|zoom|teams|meet|calendar|assistant|bot|calls?|conversations?)\b).*\bfathom\b|^[^\S\r\n]*fathom[^\S\r\n]*$', '(?i)\btl;?dv\b', '(?i)\bgong\.io\b', '(?i)^(?=.*\b(?:ai|meetings?|notes?|note[- ]?taker|transcri\w*|record\w*|zoom|teams|meet|calendar|assistant|bot|calls?|conversations?|revenue|sales)\b).*\bgong\b|^[^\S\r\n]*gong[^\S\r\n]*$', '(?i)\bavoma\b', '(?i)\bfellow\.app\b', '(?i)^(?=.*\b(?:ai|meetings?|notes?|note[- ]?taker|transcri\w*|record\w*|zoom|teams|meet|calendar|assistant|bot|calls?|conversations?)\b).*\bfellow\b|^[^\S\r\n]*fellow[^\S\r\n]*$', '(?i)^(?=.*\b(?:ai|meetings?|notes?|note[- ]?taker|transcri\w*|record\w*|zoom|teams|meet|calendar|assistant|bot|calls?|conversations?)\b).*\bgrain\b|^[^\S\r\n]*grain[^\S\r\n]*$', '(?i)\bkrisp\b', '(?i)\bai companion\b', '(?i)\bsembly\b', '(?i)\bsupernormal\b', '(?i)\bcircleback\b', '(?i)^(?=.*\b(?:ai|meetings?|notes?|note[- ]?taker|transcri\w*|record\w*|zoom|teams|meet|calendar|assistant|bot|calls?|conversations?)\b).*\bgranola\b|^[^\S\r\n]*granola[^\S\r\n]*$', '(?i)\bnotetaker\b', '(?i)\bnote[- ]?taker\b', '(?i)\bmeetgeek\b', '(?i)\bbluedothq\b', '(?i)^(?=.*\b(?:ai|meetings?|notes?|note[- ]?taker|transcri\w*|record\w*|zoom|teams|meet|calendar|assistant|bot|calls?|conversations?)\b).*\bbluedot\b|^[^\S\r\n]*bluedot[^\S\r\n]*$', '(?i)^(?=.*\b(?:ai|meetings?|notes?|note[- ]?taker|transcri\w*|record\w*|zoom|teams|meet|calendar|assistant|bot|calls?|conversations?)\b).*\bjamie\b']
        weight: 0.85
      - type: domain
        values: [otter.ai, "*.otter.ai", fireflies.ai, "*.fireflies.ai", read.ai, "*.read.ai", fathom.video, "*.fathom.video", tldv.io, "*.tldv.io", gong.io, "*.gong.io", avoma.com, fellow.app, grain.com, "*.grain.com", krisp.ai, sembly.ai, supernormal.com, circleback.ai, granola.ai, meetgeek.ai, bluedothq.com]
