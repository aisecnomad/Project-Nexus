# Known AI SaaS products and agents as they appear in identity providers
# (OAuth consent grants, enterprise apps, service principals), SaaS app
# directories (Slack apps, Teams apps, GitHub Apps, Marketplace installs) and
# egress logs. `name` patterns are matched against display names, publishers
# and descriptions; `domain` values against reply URLs, homepages and hosts.
#
# These umbrella signatures own the display names of the SaaS products they
# list; dedicated product signatures (coding-agent.*, platform.*) do not repeat
# them. Product names that are also dictionary words or first names (Otter,
# Devin, Jasper, Drift, Monica...) are context-guarded: the vendor form
# (otter.ai, devin.ai) always matches, the bare word only when it is the whole
# display name ("Gong") or when product context (ai, meeting, sales, chatbot...)
# appears on the same line. "Otter Insurance Portal" or "Devin Smith" never
# match.
#
# tags:
#   assistant       general-purpose chat assistant (data leaves the tenant)
#   meeting-bot     joins calls / reads calendars & transcripts
#   coding          acts on source code
#   automation      executes actions in other SaaS on the user's behalf
#   agent-platform  hosts autonomous agents
signatures:
  - id: identity-app.openai-chatgpt
    name: ChatGPT / OpenAI
    category: identity-app
    vendor: OpenAI
    tags: [assistant, agent-platform]
    agent_indicator: true
    signals:
      - type: name
        patterns: ['(?i)\bchat\s?gpt\b', '(?i)\bopenai\b', '(?i)\bgpt-?4\b', '(?i)\bsora\b', '(?i)\bopenai (?:operator|codex|deep research)\b']
        weight: 0.9
      - type: domain
        values: [chatgpt.com, chat.openai.com, platform.openai.com, auth.openai.com, auth0.openai.com, operator.chatgpt.com, sora.com, "*.openai.com"]
        weight: 0.9

  - id: identity-app.anthropic-claude
    name: Claude / Anthropic
    category: identity-app
    vendor: Anthropic
    tags: [assistant, agent-platform, coding]
    agent_indicator: true
    signals:
      - type: name
        patterns: ['(?i)\bclaude\b', '(?i)\banthropic\b']
        weight: 0.9
      - type: domain
        values: [claude.ai, claude.com, console.anthropic.com, "*.anthropic.com", "*.claude.ai"]
        weight: 0.9

  - id: identity-app.google-gemini
    name: Google Gemini / AI Studio / NotebookLM
    category: identity-app
    vendor: Google
    tags: [assistant, agent-platform]
    agent_indicator: true
    signals:
      - type: name
        patterns: ['(?i)\bgemini\b', '(?i)\bgoogle ai studio\b', '(?i)\bnotebooklm\b', '(?i)\bgoogle ai\b', '(?i)\bproject mariner\b']
        weight: 0.85
      - type: domain
        values: [gemini.google.com, aistudio.google.com, notebooklm.google.com, makersuite.google.com, bard.google.com]
        weight: 0.9

  - id: identity-app.microsoft-copilot
    name: Microsoft Copilot / M365 Copilot
    category: identity-app
    vendor: Microsoft
    tags: [assistant, agent-platform]
    agent_indicator: true
    signals:
      - type: name
        # "Copilot" alone is now a generic product word (identity-app.generic-ai-name
        # keeps it as a hint); Microsoft attribution needs Microsoft context.
        patterns: ['(?i)\bmicrosoft (?:365 )?copilot\b', '(?i)\bm365 copilot\b', '(?i)\bcopilot for (?:microsoft 365|sales|service|finance|security)\b', '(?i)\bcopilot (?:chat|pro|pages|notebooks)\b', '(?i)\bbing chat\b', '(?i)^(?=.*\b(?:microsoft|m365|office|365|teams|outlook|word|excel|powerpoint|dynamics|bing|edge|windows|azure)\b).*\bcopilot\b(?![-_](?:css|scss|less|themes?|kit|ui|icons?|fonts?|styles?)\b)']
        weight: 0.8
      - type: domain
        values: [copilot.microsoft.com, m365.cloud.microsoft, copilot.cloud.microsoft, "*.copilot.microsoft.com", substrate.office.com]
        weight: 0.9
      - type: client_id
        names: ["fb8d773d-7ef8-4ec0-a117-179f88add510", "ab3be6b7-f5df-413d-ac2d-abf1e3fd9c0b", "c2d02d8c-3dc4-4d3d-8bb0-d7a6d4d6d1c1"]
        weight: 0.9
        description: Microsoft first-party Copilot service principals

