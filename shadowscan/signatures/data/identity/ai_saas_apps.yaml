# Known AI SaaS products and agents as they appear in identity providers
# (OAuth consent grants, enterprise apps, service principals), SaaS app
# directories (Slack apps, Teams apps, GitHub Apps, Marketplace installs) and
# egress logs. `name` patterns are matched against display names, publishers
# and descriptions; `domain` values against reply URLs, homepages and hosts.
#
# tags:
#   assistant       general-purpose chat assistant (data leaves the tenant)
#   meeting-bot     joins calls / reads calendars & transcripts
#   coding          acts on source code
#   automation      executes actions in other SaaS on the user's behalf
#   agent-platform  hosts autonomous agents
signatures:
  - id: identity-app.openai-chatgpt
    name: ChatGPT / OpenAI
    category: identity-app
    vendor: OpenAI
    tags: [assistant, agent-platform]
    agent_indicator: true
    signals:
      - type: name
        patterns: ['(?i)\bchat\s?gpt\b', '(?i)\bopenai\b', '(?i)\bgpt-?4\b', '(?i)\bsora\b', '(?i)\bopenai (?:operator|codex|deep research)\b']
        weight: 0.9
      - type: domain
        values: [chatgpt.com, chat.openai.com, platform.openai.com, auth.openai.com, auth0.openai.com, operator.chatgpt.com, sora.com, "*.openai.com"]
        weight: 0.9

  - id: identity-app.anthropic-claude
    name: Claude / Anthropic
    category: identity-app
    vendor: Anthropic
    tags: [assistant, agent-platform, coding]
    agent_indicator: true
    signals:
      - type: name
        patterns: ['(?i)\bclaude\b', '(?i)\banthropic\b']
        weight: 0.9
      - type: domain
        values: [claude.ai, claude.com, console.anthropic.com, "*.anthropic.com", "*.claude.ai"]
        weight: 0.9

