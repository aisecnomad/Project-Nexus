[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shadowscan"
version = "0.1.1"
description = "ShadowScan: discover shadow AI agents across code, identity providers, LLM gateways, low-code platforms, SaaS, and cloud accounts."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Project Nexus" }]
keywords = ["ai-agents", "shadow-ai", "security", "discovery", "langchain", "mcp", "agentic"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "click>=8.1",
  "rich>=15.0.0",
  "PyYAML>=6.0.3",
  "requests>=2.31",
  "urllib3>=2.0,<3",
  "PyJWT[crypto]>=2.14.0",
  "regex>=2024.5.15",
]

[project.optional-dependencies]
aws = ["boto3>=1.34"]
gcp = ["google-auth>=2.58.0"]
azure = ["azure-identity>=1.16"]
oci = ["oci>=2.120"]
cloud = ["boto3>=1.34", "google-auth>=2.58.0", "azure-identity>=1.16", "oci>=2.120"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.16.8", "mypy>=1.10", "types-PyYAML", "types-requests", "responses>=0.25", "pip-audit>=2.9"]
all = ["shadowscan[cloud,dev]"]

[project.scripts]
shadowscan = "shadowscan.cli:main"

[project.entry-points."shadowscan.connectors"]
# Third-party connectors can register here: name = "package.module:ConnectorClass"

[project.urls]
Homepage = "https://github.com/aisecnomad/Project-Nexus"
Repository = "https://github.com/aisecnomad/Project-Nexus"
Changelog = "https://github.com/aisecnomad/Project-Nexus/blob/main/CHANGELOG.md"
Issues = "https://github.com/aisecnomad/Project-Nexus/issues"

[tool.setuptools.packages.find]
include = ["shadowscan*"]

[tool.setuptools.package-data]
shadowscan = ["signatures/data/**/*.yaml", "py.typed"]

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = ["tests/fixtures", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4"]
ignore = ["E501", "B008", "SIM108", "SIM102", "SIM103", "SIM113", "B904", "B034", "C408", "C416", "SIM105", "B007", "B023", "E741", "UP028", "UP042"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
# Bodies of untyped helpers (closures inside connectors) are checked too; the
# package passes today and this keeps later regressions out of those paths.
check_untyped_defs = true
