[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "NexusShadowScan"
version = "0.1.2"
description = "ShadowScan: discover shadow AI agents across code, identity providers, LLM gateways, low-code platforms, SaaS, cloud accounts, endpoints, network logs, and running processes."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11,<3.14"
authors = [{ name = "Project Nexus" }]
keywords = ["ai-agents", "shadow-ai", "security", "discovery", "langchain", "mcp", "agentic"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: System :: Systems Administration",
  "Typing :: Typed",
]
dependencies = [
  "click>=8.5.0",
  "rich>=15.0.0",
  "PyYAML>=6.0.3",
  "requests>=2.34.2",
  "urllib3>=2.8.0,<3",
  "PyJWT[crypto]>=2.14.0",
  "regex>=2026.9.10",
]

[project.optional-dependencies]
aws = ["boto3>=1.43.99"]
gcp = ["google-auth>=2.58.0"]
azure = ["azure-identity>=1.25.3"]
oci = ["oci>=2.187.0"]
cloud = ["boto3>=1.43.99", "google-auth>=2.58.0", "azure-identity>=1.25.3", "oci>=2.187.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "pytest-xdist>=3.5", "hypothesis>=6.100", "ruff>=0.16.8", "mypy>=1.10", "types-PyYAML", "types-requests", "responses>=0.25", "pip-audit>=2.9", "jsonschema>=4.18", "pre-commit>=4.6.2", "setuptools>=84.0.0", "wheel>=0.48.0"]
docs = ["mkdocs-material>=9.7.7", "mkdocstrings[python]>=1.0.6"]
all = ["NexusShadowScan[cloud,dev,docs]"]

[project.scripts]
shadowscan = "shadowscan.cli:main"

[project.entry-points."shadowscan.connectors"]
# Third-party connectors can register here: name = "package.module:ConnectorClass"

[project.urls]
Homepage = "https://github.com/aisecnomad/Project-Nexus"
Documentation = "https://github.com/aisecnomad/Project-Nexus/tree/main/docs"
Repository = "https://github.com/aisecnomad/Project-Nexus"
Changelog = "https://github.com/aisecnomad/Project-Nexus/blob/main/CHANGELOG.md"
"Release notes" = "https://github.com/aisecnomad/Project-Nexus/blob/main/RELEASE_NOTES.md"
Security = "https://github.com/aisecnomad/Project-Nexus/blob/main/SECURITY.md"
Issues = "https://github.com/aisecnomad/Project-Nexus/issues"

[tool.setuptools.packages.find]
include = ["shadowscan*"]

[tool.setuptools.package-data]
shadowscan = ["signatures/data/**/*.yaml", "signatures/data/**/*.yml", "py.typed"]

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = ["tests/fixtures", "examples"]

[tool.ruff.lint]
# BLE: a broad `except` that does not re-raise is flagged; an intentional one
# carries `# noqa: BLE001 - <reason>` (tests/test_repository_consistency.py
# requires the reason). RUF100: a `noqa` that suppresses nothing is flagged.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "BLE", "RUF100"]
ignore = ["SIM108", "SIM102", "SIM103", "C408", "SIM105", "UP042"]

[tool.ruff.lint.per-file-ignores]
# Tests hold long literal fixtures (source snippets, tokens, JSON records).
"tests/**" = ["E501"]
# Benchmark case templates embed source files from other languages verbatim.
"tools/benchmark/*_cases.py" = ["E501"]
"benchmarks/*/corpus.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Unknown markers fail collection: a misspelt opt-out marker such as
# production_budgets would otherwise be ignored without a warning.
pythonpath = ["."]
addopts = "-q --strict-markers"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
disallow_untyped_defs = true
check_untyped_defs = true
# First-party imports and stubbed libraries (types-PyYAML, types-requests from
# the dev extra) are checked; only the listed third-party packages, which ship
# neither stubs nor a py.typed marker, may be imported untyped.
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = [
    "regex",
    "boto3",
    "boto3.*",
    "botocore",
    "botocore.*",
    "oci",
    "oci.*",
    "google.auth",
    "google.auth.*",
    "azure.identity",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["shadowscan"]
omit = ["shadowscan/signatures/data/*"]
# Both floors (fail_under below and tools/coverage_gate.py) count branches as
# well as statements: a line that ran says nothing about its untaken branch.
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 80
